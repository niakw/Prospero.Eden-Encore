name: Verify pinned vendor submodule
on:
  push:
    paths:
      - 'vendor'
      - '.gitmodules'
      - 'tools/check-vendor-submodule.sh'
      - '.github/workflows/verify-vendor-submodule.yml'
  pull_request:
    paths:
      - 'vendor'
      - '.gitmodules'
      - 'tools/check-vendor-submodule.sh'
      - '.github/workflows/verify-vendor-submodule.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Verify exact pinned vendor SHA and original paths
        run: bash tools/check-vendor-submodule.sh
