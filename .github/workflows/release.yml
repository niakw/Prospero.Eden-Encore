name: Eden 0.40 Improved release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eden-040-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools llvm-spirv-18 libllvmspirvlib-18-dev \
            cmake ninja-build ccache make nasm meson rsync git \
            glslang-tools spirv-tools bison flex curl wget unzip librsvg2-bin imagemagick \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config

      - name: Upgrade Meson
        run: |
          python3 -m pip install --user --break-system-packages "meson>=1.4,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Check toolchain
        run: make toolchain

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            .deps
          key: eden-040-improved-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}
          restore-keys: |
            eden-040-improved-${{ runner.os }}-

      - name: Build and package
        run: bash tools/ci/build-release.sh

      - name: Match the tag to the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test -f "dist/ProsperoEden-${GITHUB_REF_NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-0.40-Improved-PS5-13.60
          path: dist/
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Eden-0.40-Improved-PS5-13.60
          path: dist

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease
          --title "Eden 0.40 Improved $GITHUB_REF_NAME" --notes-file dist/release-notes.md
          "dist/ProsperoEden-$GITHUB_REF_NAME.zip" dist/SHA256SUMS
