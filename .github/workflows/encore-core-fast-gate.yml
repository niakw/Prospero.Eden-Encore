# Least privilege for the host-only gate (CodeQL workflow permissions #57).
permissions:
  contents: read

concurrency:
  group: encore-fast-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Install host-only C++ fixture headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-container-dev nlohmann-json3-dev
      - name: C++ compiler version
        run: |
          g++ --version
          python3 --version
      # Gate the exact generated/native Vulkan translation units *before*
      # fast host fixtures. The earlier gate could be green while the full
      # preflight failed on an ordered generator replacement mismatch.
      - name: Pinned Vulkan source reproduction
        run: |
          set -euo pipefail
          python3 -B tools/check-vendored-vulkan-fork.py
      # A CMake-selected native override must have exactly one graph owner
      # and one catalogue row before the longer GPU and JIT host replays.
      - name: Active native source ownership and graph parity
        run: |
          set -euo pipefail
          python3 -B tools/check-active-source-inventory.py
      - name: Vulkan arithmetic and frame worker guards
        run: |
          set -euo pipefail
          python3 -B tools/check-vulkan-renderpass-clear-bounds-host.py
