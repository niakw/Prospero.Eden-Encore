name: Encore core fast gate

on:
  push:
    branches:
      - dev/ps5-sparse-jit
    paths:
      - 'vendor/encore-active/eden-core/src/dynarmic/**'
      - 'vendor/encore-active/eden-core/src/common/sparse_large_vector.h'
      - 'tools/check-sparse-zero-bounds-host.py'
      - 'vendor/encore-active/eden-vulkan/**'
      - 'vendor/encore-active/eden-threading/src/core/hle/kernel/k_thread.cpp'
      - 'tools/check-native-hle-wait-queue-publication-host.py'
      - 'tools/verify/hle/check-hle-overlay-layout.py'
      - 'tools/check-vulkan-multirange-overflow-host.py'
      - 'tools/check-vulkan-renderpass-clear-bounds-host.py'
      - 'tools/check-vulkan-worker-fatal-drain-host.py'
      - 'tools/check-native-a64-default-phases-host.py'
      - 'tools/check-native-a64-cache-invalidation-host.py'
      - 'tools/prepare-vulkan-port.py'
      - '.github/workflows/encore-core-fast-gate.yml'
  workflow_dispatch:

concurrency:
  group: encore-fast-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: C++ compiler version
        run: |
          g++ --version
          python3 --version
      - name: Vulkan arithmetic and frame worker guards
        run: |
          set -euo pipefail
          python3 -B tools/check-vulkan-renderpass-clear-bounds-host.py
          python3 -B tools/check-vulkan-multirange-overflow-host.py
          python3 -B tools/check-vulkan-worker-fatal-drain-host.py
      - name: Default JIT compiler and cache invalidation guards
        run: |
          set -euo pipefail
          python3 -B tools/check-native-a64-default-phases-host.py
          python3 -B tools/check-native-a64-cache-invalidation-host.py
          python3 -B tools/check-jit-sparse-host.py
          python3 -B tools/check-sparse-zero-bounds-host.py
          python3 -B tools/check-maintained-sparse-vector.py
      - name: Native HLE waiter publication and overlay parity
        run: |
          set -euo pipefail
          python3 -B tools/check-native-hle-wait-queue-publication-host.py
          python3 -B tools/verify/hle/check-hle-overlay-layout.py
      - name: Boundary
        run: |
          echo 'Host source-derived checks only; native package, GPU and FPS remain unqualified.'
