name: Encore launcher render preview (host only)

on:
  # The developer branch only; the job below requires [preview-ready] for pushes.
  push:
    branches: [dev/ps5-sparse-jit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encore-launcher-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Do not compile while WIP. Only an explicit final ready marker or manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview-ready]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout actual launcher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static Nlib and all-game runtime guard
        run: |
          python3 -B tools/check-nlib-media-safety.py
          python3 -B tools/check-universal-emulation-policy.py
          python3 -B tools/check-home-reference.py
          python3 -B tools/check-native-ui-focus.py
          python3 -B tools/check-home-media.py
          python3 -B tools/check-encore-ux.py

      - name: Install minimal software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-pil libegl1-mesa-dev libgl1-mesa-dev libstb-dev nlohmann-json3-dev \
            mesa-utils libgl1-mesa-dri ca-certificates git pkg-config

      - name: Build and capture actual Encore launcher at 1920x1080
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_HOME_ONLY: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-launcher-only
        run: |
          set -o pipefail
          bash tools/launcher/preview.sh build/launcher-production 1920 1080 \
            2>&1 | tee build-launcher-render.log

      - name: Verify rendered PNGs are real nonempty RGBA images
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          paths = sorted(Path("build/launcher-production").glob("*.png"))
          required = ["00-arriving.png", "01-home.png", "02-home-details-focus.png",
                      "03-home-recent-focus.png", "04-home-settings-focus.png"]
          assert [p.name for p in paths] == required, [p.name for p in paths]
          for path in paths:
              with Image.open(path) as im:
                  im.load()
                  assert im.size == (1920, 1080), (path, im.size)
                  rgb = im.convert("RGB")
                  variation = sum(ImageStat.Stat(rgb.resize((64, 36))).stddev)
                  assert variation > 12, (path, variation)
                  print(path.name, im.size, f"stddev={variation:.1f}", path.stat().st_size)
          # Verify the selected cover retains its original palette: formerly
          # a pink shadow was composited OVER the red/orange game art.
          # Sample a uniform sky patch inside tile #2, away from the edges.
          with Image.open(paths[1]) as unfocused, Image.open(paths[3]) as focused:
              sample = (375, 568, 399, 592)
              rgb_before = ImageStat.Stat(unfocused.convert("RGB").crop(sample)).mean
              rgb_after = ImageStat.Stat(focused.convert("RGB").crop(sample)).mean
              shift = [round(abs(x - y), 1) for x, y in zip(rgb_before, rgb_after)]
              print("focused_tile_rgb_shift", shift)
              assert max(shift) < 45, ("focus desaturated real artwork", shift)
          print("RENDERED_FROM_REAL_CPP_GL_LAUNCHER: PASS")
          PY

      - name: Capture native launch-case render with original C++/OpenGL
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_LAUNCH_ONLY: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-launcher-only
        run: |
          set -o pipefail
          bash tools/launcher/preview.sh build/launch-case-render 1920 1080 \
            2>&1 | tee build-launch-case-render.log

      - name: Verify the real front/back screenshots
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          from pathlib import Path
          path = Path("build/launch-case-render")
          expected = ["00-launch-case-front.png", "01-launch-case-back.png"]
          screenshots = sorted(path.glob("*.png"))
          assert [item.name for item in screenshots] == expected, screenshots
          with Image.open(screenshots[0]) as front, Image.open(screenshots[1]) as back:
              assert front.size == back.size == (1920, 1080)
              front_rgb, back_rgb = front.convert("RGB"), back.convert("RGB")
              area = (360, 205, 760, 795)
              delta = ImageStat.Stat(ImageChops.difference(
                  front_rgb.crop(area), back_rgb.crop(area))).mean
              assert max(delta) > 10, ("front/back image did not turn", delta)
              for image, filepath in ((front_rgb, screenshots[0]), (back_rgb, screenshots[1])):
                  variation = sum(ImageStat.Stat(image.resize((64, 36))).stddev)
                  assert variation > 12 and filepath.stat().st_size > 20000
                  print(filepath.name, "actual OpenGL", filepath.stat().st_size, variation)
          print("LAUNCH_CASE_CPP_OPENGL_RENDER: PASS")
          PY

      - name: Export full-resolution production-render evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Encore-launcher-native-render-1080p
          path: |
            build/launcher-production/*.png
            build/launch-case-render/*.png
            build-launcher-render.log
            build-launch-case-render.log
          if-no-files-found: error
          retention-days: 14
