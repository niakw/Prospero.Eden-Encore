name: Encore launcher render preview (host only)

on:
  # Run automatically for the ONLY active development branch when the UI,
  # cached artwork pipeline, its fixtures or this preview workflow changes.
  # Unrelated GPU/JIT changes do not spend a full render CI run.
  push:
    branches: [dev/ps5-sparse-jit]
    paths:
      - 'vendor'
      - '.gitmodules'
      - ".github/workflows/launcher-production-preview.yml"
      - "headless/prosperoeden/**"
      - "tools/launcher/**"
      - "tools/check-launch-case-artwork.py"
      - "tools/check-launcher-shoulder-and-cover.py"
      - "tools/check-encore-case-media-selection-host.py"
      - "tools/check-launcher-translation-coverage.py"
      - "tools/check-switch-theme-layout.py"
      - "tools/package-headless-native.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encore-launcher-preview-${{ github.ref }}-${{ github.sha }}
  # Native/JIT branches move often. A later unrelated push must not cancel
  # in-flight capture of a precisely pinned launcher commit.
  cancel-in-progress: false

jobs:
  preview:
    # Path-filtered push or explicit manual dispatch; no commit-message
    # magic string required. A "skipped" UI preview hid regressions.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout actual launcher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Validate only the universal case renderer contract
        run: |
          python3 -B tools/check-launch-case-artwork.py
          python3 -B tools/check-launcher-shoulder-and-cover.py
          python3 -B tools/check-encore-case-media-selection-host.py

      - name: Install minimal software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-pil libegl1-mesa-dev libgl1-mesa-dev libstb-dev nlohmann-json3-dev \
            mesa-utils libgl1-mesa-dri ca-certificates git pkg-config

      - name: Verify all 29 translations and original geometry
        run: |
          python3 -B tools/launcher/strings.py check
          python3 -B tools/check-launcher-translation-coverage.py
          python3 -B tools/check-switch-theme-layout.py

      - name: Verify theme preference persistence
        run: |
          c++ -std=c++20 -O0 -Iheadless tools/launcher/theme-store-check.cpp -o /tmp/encore-theme-store-check
          /tmp/encore-theme-store-check
          echo "ENCORE_SWITCH_THEME_PERSISTENCE: PASS"

      - name: Fetch existing retail art for host visual evidence
        run: |
          python3 -B tools/launcher/preview-botw-media.py build/launch-case-render

      - name: Capture native launch-case render with original C++/OpenGL
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_LAUNCH_ONLY: "1"
          PE_PREVIEW_BOTW: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-launcher-only
        run: |
          set -o pipefail
          bash tools/launcher/preview.sh build/launch-case-render 1920 1080 \
            2>&1 | tee build-launch-case-render.log

      - name: Verify the real front/back screenshots
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          from pathlib import Path
          path = Path("build/launch-case-render")
          expected = ["00-launch-case-front.png", "01-launch-case-spine.png",
                      "02-launch-case-back.png"]
          screenshots = sorted(path.glob("*.png"))
          assert [item.name for item in screenshots] == expected, screenshots
          receipts = (path / "source-receipts.txt").read_text()
          assert len(receipts.splitlines()) in (3, 4) and "botw-front.tga" in receipts
          assert "botw-back.tga" in receipts and "botw-hero.tga" in receipts
          # The physical front MUST be European, never a higher-resolution
          # North American image silently promoted over the selected region.
          front_receipt = next(line for line in receipts.splitlines()
                               if line.startswith("botw-front.tga\t"))
          eu_fronts = ("9524e5f7-ccc8-4ce6-a581-03f82c51825e.jpg",
                       "a8bcb4cc-a3b0-4cf0-82f3-cb10dd18b27c.jpg")
          assert any(id in front_receipt for id in eu_fronts), front_receipt
          assert "BotW_NA_Switch_Box_Art" not in receipts
          # Official spine may be unavailable in native resolution: then
          # the game uses the clean red title-free empty-side fallback.
          with Image.open(screenshots[0]) as front, Image.open(screenshots[2]) as back:
              assert front.size == back.size == (1920, 1080)
              front_rgb, back_rgb = front.convert("RGB"), back.convert("RGB")
              area = (360, 205, 760, 795)
              delta = ImageStat.Stat(ImageChops.difference(
                  front_rgb.crop(area), back_rgb.crop(area))).mean
              assert max(delta) > 10, ("front/back image did not turn", delta)
              for image, filepath in ((front_rgb, screenshots[0]), (back_rgb, screenshots[2])):
                  variation = sum(ImageStat.Stat(image.resize((64, 36))).stddev)
                  # A correct backdrop/logo with an entirely blank case face
                  # previously passed. Measure *inside* the printed scan.
                  face_detail = sum(ImageStat.Stat(
                      image.crop((480, 270, 565, 620))).stddev)
                  assert face_detail > 18, ("case texture not loaded", filepath, face_detail)
                  assert variation > 12 and filepath.stat().st_size > 20000
                  print(filepath.name, "actual OpenGL", filepath.stat().st_size,
                        variation, "face detail", face_detail)
          with Image.open(screenshots[1]) as edge:
              assert edge.size == (1920, 1080)
              delta = ImageStat.Stat(ImageChops.difference(
                  edge.convert("RGB").crop((380, 200, 810, 810)),
                  front_rgb.crop((380, 200, 810, 810)))).mean
              assert max(delta) > 15, ("3D quarter-turn not distinguishable", delta)
          print("LAUNCH_CASE_CPP_OPENGL_RENDER: PASS")
          PY

      - name: Render same projective box with generic game-art fallback
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_LAUNCH_ONLY: "1"
          PE_PREVIEW_NO_BOX_SCANS: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-launcher-only
        run: |
          set -o pipefail
          bash tools/launcher/preview.sh build/launch-case-generic 1920 1080 \
            2>&1 | tee build-launch-case-generic.log
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          folder = Path("build/launch-case-generic")
          names = sorted(path.name for path in folder.glob("*.png"))
          assert names == ["00-launch-case-front.png", "01-launch-case-spine.png",
                           "02-launch-case-back.png"], names
          for filepath in sorted(folder.glob("*.png")):
              with Image.open(filepath) as frame:
                  assert frame.size == (1920, 1080)
                  assert sum(ImageStat.Stat(frame.convert("RGB").resize((64, 36))).stddev) > 12
          # Host screenshots are from the real C++/OpenGL pipeline. If the
          # missing-scan paths quietly revert to one square icon on both
          # faces, source tests alone cannot detect that visual regression.
          from PIL import ImageChops
          with Image.open(folder / "00-launch-case-front.png") as front:
              with Image.open(folder / "02-launch-case-back.png") as back:
                  area = (440, 175, 780, 840)
                  diff = ImageChops.difference(
                      front.convert("RGB").crop(area),
                      back.convert("RGB").crop(area))
                  assert max(ImageStat.Stat(diff).mean) > 8, "front and back look identical"
          generic_log = Path("build-launch-case-generic.log").read_text(errors="replace")
          for side in ("front", "back"):
              assert (f"EDEN_CASE_COMPOSE title=" in generic_log and
                      f"side={side} status=ready" in generic_log), (
                          "native composited sleeve did not reach GL", side)
          print("UNIVERSAL_CASE_NO_RETAIL_ART: PASS")
          PY

      - name: Verify mixed original/reconstructed faces separately
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_JOBS: "2"
          PE_PREVIEW_LAUNCH_ONLY: "1"
          PE_PREVIEW_BOTW: "1"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-launcher-only
        run: |
          set -euo pipefail
          for kind in front-only back-only; do
            mkdir -p "build/launch-case-${kind}"
            cp build/launch-case-render/botw-*.tga "build/launch-case-${kind}/"
            if [[ $kind == front-only ]]; then
              export PE_PREVIEW_NO_BOX_BACK=1
              unset PE_PREVIEW_NO_BOX_FRONT
            else
              export PE_PREVIEW_NO_BOX_FRONT=1
              unset PE_PREVIEW_NO_BOX_BACK
            fi
            bash tools/launcher/preview.sh "build/launch-case-${kind}" 1920 1080 \
              2>&1 | tee "build-launch-case-${kind}.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          for kind, missing, original in (("front-only", "back", "front"),
                                          ("back-only", "front", "back")):
              log = Path(f"build-launch-case-{kind}.log").read_text(errors="replace")
              assert f"side={missing} status=ready" in log and "EDEN_CASE_COMPOSE" in log, (kind, "missing side not composed")
              assert f"side={original} status=ready source=retail" in log, (kind, "genuine side not used")
              for line in log.splitlines():
                  if "EDEN_CASE_COMPOSE" in line:
                      assert f"side={original}" not in line, (kind, "original side was recomposed", line)
              path = Path("build") / f"launch-case-{kind}"
              expected = ["00-launch-case-front.png", "01-launch-case-spine.png",
                          "02-launch-case-back.png"]
              assert sorted(p.name for p in path.glob("*.png")) == expected, kind
              for name in (expected[0], expected[2]):
                  with Image.open(path / name) as frame:
                      assert frame.size == (1920, 1080)
                      assert sum(ImageStat.Stat(frame.convert("RGB").crop((480, 270, 565, 620))).stddev) > 17, (kind, name)
              if kind == "front-only":
                  # With ONLY the front Hero and no independent screenshot,
                  # the reconstructed back must be PLAIN OPAQUE PAPER, not
                  # the front recycled inside an isolated black rectangle.
                  # Verify the real projected upper left of the 3D face,
                  # away from caption and clear-plastic lip.
                  with Image.open(path / "02-launch-case-back.png") as rear:
                      printed = ImageStat.Stat(rear.convert("RGB").crop(
                          (410, 200, 470, 420)))
                      assert max(printed.stddev) < 12, (
                          "empty rear has an unexpected pasted image/patch",
                          printed.mean, printed.stddev)
                      assert all(abs(channel - stock) < 12 for channel, stock
                                 in zip(printed.mean, (17, 34, 53))), (
                          "reconstructed 3D rear lacks the complete ink stock",
                          printed.mean, printed.stddev)
              print(f"INDEPENDENT_CASE_FACE_{kind.upper()}: PASS")
          PY

      - name: Capture real Library jackets, focus and back enlargement
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_LIBRARY_ONLY: "1"
          PE_PREVIEW_BOTW: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-launcher-only
        run: |
          set -o pipefail
          mkdir -p build/launch-case-library
          cp build/launch-case-render/botw-*.tga build/launch-case-library/
          bash tools/launcher/preview.sh build/launch-case-library 1920 1080 \
            2>&1 | tee build-launch-case-library.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          folder = Path("build/launch-case-library")
          expected = ["00-library-front-shelf.png", "01-library-back-focus.png",
                      "02-library-back-zoom.png", "03-library-back-zoom-pan.png",
                      "04-library-back-zoom-out.png",
                      "05-library-back-cross-ignored.png",
                      "06-library-back-closed.png"]
          files = sorted(folder.glob("*.png"))
          assert [f.name for f in files] == expected, files
          for image_file in files:
              with Image.open(image_file) as frame:
                  assert frame.size == (1920, 1080)
                  assert sum(ImageStat.Stat(frame.convert("RGB")).stddev) > 15
          with Image.open(files[0]) as shelf, Image.open(files[1]) as focus, Image.open(files[2]) as zoom:
              crop = (630, 140, 1280, 880)
              difference = ImageStat.Stat(ImageChops.difference(
                  focus.convert("RGB").crop(crop), zoom.convert("RGB").crop(crop))).mean
              assert max(difference) > 15, difference
              # A popup with no decoded texture once passed these tests.
              # Require actual high-detail printed pixels inside BOTH
              # the selected original front and the enlarged rear scan.
              front_detail = sum(ImageStat.Stat(
                  shelf.convert("RGB").crop((1230, 210, 1395, 470))).stddev)
              back_detail = sum(ImageStat.Stat(
                  zoom.convert("RGB").crop((740, 320, 1150, 730))).stddev)
              assert front_detail > 45, ("blank original front", front_detail)
              assert back_detail > 45, ("blank expanded original back", back_detail)
              print("retail pixels", front_detail, back_detail)
          # Stronger than a source token check: actually render the enlarged
          # print and show movement from D-pad, zoom-out, and ignored Cross.
          with Image.open(files[2]) as baseline, Image.open(files[3]) as moved, \
               Image.open(files[4]) as reduced, Image.open(files[5]) as ignored:
              crop = (760, 270, 1150, 690)
              def diff(a, b):
                  return max(ImageStat.Stat(ImageChops.difference(
                      a.convert("RGB").crop(crop),
                      b.convert("RGB").crop(crop))).mean)
              assert diff(baseline, moved) > 10, "R2 zoom / D-pad pan inactive"
              assert diff(moved, reduced) > 8, "L2 zoom-out inactive"
              assert diff(reduced, ignored) < 8, "Cross closed/changed the viewer"
          print("ENCORE_LIBRARY_FLAT_JACKETS_ZOOM_PAN_CIRCLE_ONLY: PASS")
          PY

      - name: Capture reconstructed Library paper using production OpenGL
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_LIBRARY_FALLBACK: "1"
          PE_PREVIEW_NO_BOX_SCANS: "1"
          PE_PREVIEW_BOTW: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-launcher-only
        run: |
          set -euo pipefail
          mkdir -p build/launch-case-library-fallback
          cp build/launch-case-render/botw-hero.tga build/launch-case-library-fallback/
          bash tools/launcher/preview.sh build/launch-case-library-fallback 1920 1080 \
            2>&1 | tee build-launch-case-library-fallback.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat, ImageChops
          folder = Path("build/launch-case-library-fallback")
          expected = ["00-library-fallback-front.png",
                      "01-library-fallback-back.png",
                      "02-library-fallback-zoom.png"]
          assert sorted(p.name for p in folder.glob("*.png")) == expected
          frames = []
          for name in expected:
              with Image.open(folder / name) as picture:
                  assert picture.size == (1920, 1080)
                  frames.append(picture.convert("RGB"))
          # Inspect the actual selected shelf paper, reconstructed rear
          # paper, and zoomed upper artwork/lower immutable footer.
          regions = ((835, 215, 1080, 530),
                     (140, 638, 277, 860),
                     (800, 350, 1120, 845))
          for frame, region in zip(frames, regions):
              pixels = frame.crop(region)
              detail = sum(ImageStat.Stat(pixels).stddev)
              assert detail > 17.0, ("missing composited paper", region, detail)
          # Merely moving focus to the existing rear paper need not alter
          # its artwork; compare the enlarged overlay with the unzoomed
          # Library instead of demanding a false content difference.
          region = (800, 350, 1120, 845)
          a = frames[2].crop(region)
          b = frames[1].crop(region)
          assert max(ImageStat.Stat(ImageChops.difference(a, b)).mean) > 4
          print("LIBRARY_RECONSTRUCTED_PAPER_OPENGL: PASS")
          PY

      - name: Capture alternate layout theme (host only)
        if: ${{ github.ref == 'refs/heads/ui/encore-switch-theme-20261016' }}
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_SWITCH_THEME: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-launcher-only
        run: |
          set -o pipefail
          bash tools/launcher/preview.sh build/launch-switch-theme 1920 1080 2>&1 | tee build-launch-switch-theme.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat, ImageChops
          folder=Path("build/launch-switch-theme")
          expected=["00-switch-home.png","01-switch-all-software.png",
                    "02-switch-settings.png","03-switch-appearance.png",
                    "04-switch-storage.png","05-switch-language.png",
                    "06-switch-exit-confirm.png",
                    "07-switch-game-options.png","08-switch-game-mods.png",
                    "09-switch-button-mapping.png",
                    "10-switch-mods-installed.png","11-switch-mod-enabled.png"]
          files=sorted(folder.glob("*.png"))
          assert [f.name for f in files] == expected, files
          for file in files:
              with Image.open(file) as image:
                  assert image.size==(1920,1080)
                  assert sum(ImageStat.Stat(image.convert("RGB")).stddev) > 18
          # A white modal alone is insufficient: the screenshot tour must
          # reach THREE different native dialogs. Compare the heading region
          # to reject duplicate screenshots under different filenames.
          headings=[]
          for filename in ("07-switch-game-options.png",
                           "08-switch-game-mods.png",
                           "09-switch-button-mapping.png"):
              with Image.open(folder / filename) as source:
                  headings.append(source.convert("RGB").crop((455,145,1240,250)))
          for a,b in ((0,1),(1,2),(0,2)):
              delta=ImageStat.Stat(ImageChops.difference(headings[a],headings[b]))
              assert sum(delta.mean)>10.0, (
                  f"advanced preview has repeated heading in {a} and {b}")
          print("SWITCH_ADVANCED_MODAL_TOUR: PASS")

          with Image.open(folder / "10-switch-mods-installed.png") as before_file, Image.open(folder / "11-switch-mod-enabled.png") as after_file:
              before=before_file.convert("RGB").crop((475,360,1250,525))
              after=after_file.convert("RGB").crop((475,360,1250,525))
              change=sum(ImageStat.Stat(ImageChops.difference(before,after)).mean)
              assert change>3.0, "mod toggle did not update the actual Switch UI"
          print("SWITCH_MODS_SAVE_AND_VISUAL_FEEDBACK: PASS")

          # Confirmation must be an actual light overlay, not a mislabeled
          # screenshot of HOME or an Encore neon dialog.
          with Image.open(folder / "06-switch-exit-confirm.png") as image:
              img=image.convert("RGB")
              assert img.getpixel((50,50))[0] < 190, "confirmation scrim missing"
              assert min(img.getpixel((920,540))) > 235, "light dialog missing"
              # Native prompt belongs inside the dialog, never repeated as a
              # red notification underneath. This caught a real visual bug.
              feedback=img.crop((145,695,800,745))
              red=sum(r > 100 and r > g * 1.3 and r > b * 1.12
                      for r,g,b in feedback.getdata())
              assert red < 40, f"stray red confirmation text: {red} pixels"
          # All advanced surfaces use the light theme while preserving
          # the real backend controllers and settings navigation.
          for filename in ("07-switch-game-options.png",
                           "08-switch-game-mods.png",
                           "09-switch-button-mapping.png"):
              with Image.open(folder / filename) as raw:
                  frame=raw.convert("RGB")
                  assert min(frame.getpixel((480,145))) > 220, filename
                  assert max(frame.getpixel((120,240))) < 205, filename
          print("SWITCH_THEME_NATIVE_HOST_CAPTURE: PASS")
          PY

      - name: Export full-resolution production-render evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Encore-launcher-native-render-1080p
          path: |
            build/launch-case-render/*.png
            build/launch-case-generic/*.png
            build/launch-case-front-only/*.png
            build/launch-case-back-only/*.png
            build-launch-case-front-only.log
            build-launch-case-back-only.log
            build/launch-case-library/*.png
            build/launch-case-library-fallback/*.png
            build-launch-case-library-fallback.log
            build/launch-switch-theme/*.png
            build-launch-switch-theme.log
            build-launch-case-library.log
            build-launch-case-render.log
            build-launch-case-generic.log
          if-no-files-found: error
          retention-days: 14
