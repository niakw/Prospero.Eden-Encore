name: Discover Switch 1 controller UI mods (metadata only)

# GitHub schedules run on the default branch ONLY. Do not modify release
# branch; use workflow_dispatch on dev/ps5-sparse-jit for live incremental scans.
on:
  push:
    branches: [dev/ps5-sparse-jit]
    paths:
      - .github/workflows/discover-switch1-glyph-mods.yml
      - tools/ps-glyph-switch1-corpus.py
      - tools/check-ps-glyph-mod-discovery.py
      - tools/ps-glyph-switch1-search-queue.py
      - tools/check-ps-glyph-switch1-search-queue.py
      - tools/ps-glyph-mod-discovery.py
      - tools/ps-glyph-curl-search.py
      - tools/check-ps-glyph-curl-search.py
      - tools/ps-glyph-firefox-search.py
      - tools/check-ps-glyph-firefox-search.py
      - tools/ps-glyph-multiplatform-adapt.py
      - tools/check-ps-glyph-multiplatform-adapt.py
      - tools/ps-glyph-mod-results-merge.py
      - tools/check-ps-glyph-mod-results-merge.py
  workflow_dispatch:
    inputs:
      provider:
        description: "Source; none = offline links, Yandex requires paid API credentials"
        required: true
        type: choice
        options: [none, github, curl_duckduckgo, curl_yandex, firefox_duckduckgo, firefox_yandex, duckduckgo, yandex]
        default: github
      max_games:
        description: "Next 1-250 Switch titles"
        required: true
        type: number
        default: 20
      query_variant:
        description: "0=Switch; 1=multiplatform; 2=GameBanana; 3=Russian"
        required: true
        type: choice
        options: ["0", "1", "2", "3"]
        default: "0"

permissions:
  contents: write
concurrency:
  group: eden-ps-glyph-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata-source-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Validate sources, parsers, state and billing boundaries
        run: |
          python3 -B tools/check-ps-glyph-mod-discovery.py
          python3 -B tools/check-ps-glyph-multiplatform-adapt.py
          python3 -B tools/check-ps-glyph-mod-results-merge.py
          python3 -B tools/check-ps-glyph-switch1-search-queue.py
          python3 -B tools/check-ps-glyph-curl-search.py
          python3 -B tools/check-ps-glyph-firefox-search.py
      - name: Load public Switch 1 game title metadata
        run: |
          mkdir -p /tmp/eden-title-catalog /tmp/eden-glyph-discovery
          succeeded=0
          for region in US.en GB.en JP.ja FR.fr; do
            if curl --fail --location --silent --show-error --retry 2 \
                --connect-timeout 10 --max-time 50 \
                "https://raw.githubusercontent.com/blawar/titledb/master/${region}.json" \
                -o "/tmp/eden-title-catalog/${region}.json"; then
              succeeded=$((succeeded+1))
            else
              rm -f "/tmp/eden-title-catalog/${region}.json"
              echo "::warning::No public Switch1 metadata for ${region}"
            fi
          done
          if (( succeeded == 0 )); then
            echo "::error::Cannot construct catalog from zero verified data sources"
            exit 1
          fi
          python3 -B tools/ps-glyph-switch1-corpus.py \
            --regions /tmp/eden-title-catalog/*.json \
            --out /tmp/eden-glyph-discovery/catalog.json
          python3 -B tools/ps-glyph-switch1-search-queue.py \
            --catalog /tmp/eden-glyph-discovery/catalog.json \
            --out /tmp/eden-glyph-discovery/all-switch1-search-queue.json
      - name: Restore last completed Switch game Title IDs
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/eden-glyph-mods/progress.json
            .cache/eden-glyph-mods/leads.json
          key: eden-glyph-cursor-${{ github.run_id }}
          restore-keys: |
            eden-glyph-cursor-
      - name: Install Firefox only when explicitly selected
        if: github.event_name == 'workflow_dispatch' && (inputs.provider == 'firefox_duckduckgo' || inputs.provider == 'firefox_yandex')
        run: |
          python3 -m pip install --user --break-system-packages playwright
          python3 -m playwright install --with-deps firefox
      - name: Incremental source discovery without mod downloads
        env:
          SELECTED: ${{ inputs.provider || 'github' }}
          LIMIT: ${{ inputs.max_games || '5' }}
          VARIANT: ${{ inputs.query_variant || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_SEARCH_FOLDER_ID: ${{ secrets.YANDEX_SEARCH_FOLDER_ID }}
        run: |
          # Every dev push: free GitHub + DuckDuckGo queries in distinct Switch/PC sweeps.
          # Metered Yandex requires explicitly configured credentials.
          if test "$GITHUB_EVENT_NAME" = push; then
            SELECTED=github
            LIMIT=5
          fi
          if test "$SELECTED" = yandex && \
             { test -z "$YANDEX_SEARCH_API_KEY" || test -z "$YANDEX_SEARCH_FOLDER_ID"; }; then
            echo "::error::Yandex Search requires paid API opt-in"
            exit 1
          fi
          common=(--catalog /tmp/eden-glyph-discovery/catalog.json
                  --provider "$SELECTED" --max-games "$LIMIT" --interval 2)
          if test "$SELECTED" != none; then common+=(--network); fi
          # The committed repository data takes precedence when Action cache
          # has expired, been evicted, or is inaccessible on a fresh runner.
          mkdir -p .cache/eden-glyph-mods
          for file in progress leads; do
            if test ! -s ".cache/eden-glyph-mods/${file}.json" &&
               test -s "data/glyph-research/discovery/${file}.json"; then
              cp "data/glyph-research/discovery/${file}.json" \
                 ".cache/eden-glyph-mods/${file}.json"
            fi
          done
          previous=()
          if test -s .cache/eden-glyph-mods/progress.json; then
            previous=(--state-in .cache/eden-glyph-mods/progress.json)
          fi
          if test "$GITHUB_EVENT_NAME" = push; then
            # Broad coverage: the same title may have ONLY a PC controller
            # mod on Nexus/ModDB/GameBanana. Query both free providers and
            # both Switch/native and PC/multiplatform variants each push.
            last_state=""
            for engine in github curl_duckduckgo curl_yandex; do
              for variant in 0 1; do
                label="${engine}-switch"
                if test "$variant" = 1; then label="${engine}-multiplatform"; fi
                args=( "${previous[@]}" )
                if test -n "$last_state"; then
                  args=(--state-in "$last_state")
                fi
                batch=5
                if test "$engine" = curl_duckduckgo || test "$engine" = curl_yandex; then batch=2; fi
                if ! python3 -B tools/ps-glyph-mod-discovery.py \
                  --catalog /tmp/eden-glyph-discovery/catalog.json \
                  --provider "$engine" --network --max-games "$batch" \
                  --interval 2 "${args[@]}" --query-variant "$variant" \
                  --state-out "/tmp/eden-glyph-discovery/state-${label}.json" \
                  --report "/tmp/eden-glyph-discovery/leads-${label}.json"; then
                  echo "::warning::${engine} was throttled or rejected a query; keep partial search results"
                fi
                last_state="/tmp/eden-glyph-discovery/state-${label}.json"
              done
            done
            cp "$last_state" /tmp/eden-glyph-discovery/state-next.json
          else
            if ! python3 -B tools/ps-glyph-mod-discovery.py \
              "${common[@]}" "${previous[@]}" --query-variant "$VARIANT" \
              --state-out /tmp/eden-glyph-discovery/state-next.json \
              --report /tmp/eden-glyph-discovery/leads-manual.json; then
              echo "::warning::Search stopped; retain existing progress and evidence"
            fi
          fi
          reports=()
          if test -s .cache/eden-glyph-mods/leads.json; then
            reports+=(.cache/eden-glyph-mods/leads.json)
          fi
          for candidate in /tmp/eden-glyph-discovery/leads-*.json; do
            if test -s "$candidate"; then reports+=("$candidate"); fi
          done
          if (( ${#reports[@]} == 0 )); then
            echo "::error::No query or lead report exists"
            exit 1
          fi
          python3 -B tools/ps-glyph-mod-results-merge.py \
            --reports "${reports[@]}" \
            --out /tmp/eden-glyph-discovery/source-links.json
          python3 -B tools/ps-glyph-multiplatform-adapt.py \
            --catalog /tmp/eden-glyph-discovery/catalog.json \
            --discovery-reports /tmp/eden-glyph-discovery/source-links.json \
            --out /tmp/eden-glyph-discovery/multiplatform-adaptation-plans.json
          mkdir -p .cache/eden-glyph-mods
          cp /tmp/eden-glyph-discovery/state-next.json \
             .cache/eden-glyph-mods/progress.json
          cp /tmp/eden-glyph-discovery/source-links.json \
             .cache/eden-glyph-mods/leads.json
      - name: Commit durable source links and progress to the development repository
        if: success()
        run: |
          set -euo pipefail
          mkdir -p data/glyph-research/discovery
          cp /tmp/eden-glyph-discovery/source-links.json \
            data/glyph-research/discovery/leads.json
          cp /tmp/eden-glyph-discovery/state-next.json \
            data/glyph-research/discovery/progress.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path("data/glyph-research/discovery")
          for name in ("leads.json", "progress.json"):
              p = folder / name
              assert p.is_file() and p.stat().st_size < 16 * 1024 * 1024
              obj = json.loads(p.read_text())
              assert obj["schema"] == 1
              assert "rawData" not in p.read_text() and "YANDEX_SEARCH_API_KEY" not in p.read_text()
          print("Validated link-only stable repository metadata; no browser cookies/raw HTML/assets")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/glyph-research/discovery/leads.json \
                  data/glyph-research/discovery/progress.json
          if ! git diff --cached --quiet; then
            git commit -m "data(glyphs): persist public Switch/PC mod references and cursor [skip ci]"
            if ! git push origin HEAD:dev/ps5-sparse-jit; then
              echo "::warning::Repository branch changed or push denied. Artifacts still preserve this run's evidence."
            fi
          fi
      - name: Save durable Switch Title ID and per-console mod search cursor
        if: success()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/eden-glyph-mods/progress.json
            .cache/eden-glyph-mods/leads.json
          key: eden-glyph-cursor-${{ github.run_id }}
      - name: Preserve source links as a browsable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Switch1-Controller-Glyph-Mod-Sources
          path: |
            /tmp/eden-glyph-discovery/source-links.json
            /tmp/eden-glyph-discovery/state-next.json
            /tmp/eden-glyph-discovery/multiplatform-adaptation-plans.json
            /tmp/eden-glyph-discovery/all-switch1-search-queue.json
          if-no-files-found: warn
          retention-days: 30
