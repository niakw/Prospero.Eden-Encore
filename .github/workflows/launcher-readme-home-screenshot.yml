name: Publish authentic Encore Home screenshot

on:
  push:
    branches: [dev/ps5-sparse-jit]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encore-readme-home-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-home:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview-ready]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout authentic launcher sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install software renderer and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3-pil libegl1-mesa-dev libgl1-mesa-dev libstb-dev nlohmann-json3-dev mesa-utils libgl1-mesa-dri ca-certificates git pkg-config

      - name: Render the actual Encore C++ and OpenGL home screen
        env:
          PE_LANG: fr-FR
          PE_PREVIEW_HOME_ONLY: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-readme-home
        run: |
          bash tools/launcher/preview.sh build/readme-home 1920 1080
          test -s build/readme-home/01-home.png

      - name: Verify the real screenshot and replace READMEs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import shutil
          screenshot = Path("build/readme-home/01-home.png")
          with Image.open(screenshot) as raw:
              assert raw.format == "PNG" and raw.size == (1920, 1080)
              rgb = raw.convert("RGB")
              assert max(ImageStat.Stat(rgb).stddev) > 22, "Unexpected blank Home capture"
              assert rgb.getbbox()
          published = Path("assets/screenshots/encore-home.png")
          published.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(screenshot, published)
          targets = (
              ("README.md", "Encore tropical-night launcher artwork",
               "Real Eden Encore Home screen captured from the C++/OpenGL launcher"),
              ("README.fr.md", "Identité visuelle tropicale néon d'Encore",
               "Accueil réel d'Eden Encore capturé depuis le lanceur C++/OpenGL"),
          )
          for filename, old_alt, new_alt in targets:
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              old = ('<p align="center"><img src="assets/encore-background.jpg"'
                     f' alt="{old_alt}" width="860"></p>')
              new = ('<p align="center"><img src="assets/screenshots/encore-home.png"'
                     f' alt="{new_alt}" width="860"></p>')
              # Re-renders must work after the first README screenshot is
              # published. Reject unrelated images instead of overwriting
              # an arbitrary marketing graphic or silently duplicating it.
              if source.count(old) == 1:
                  source = source.replace(old, new)
              else:
                  assert source.count(old) == 0 and source.count(new) == 1, filename
              path.write_text(source, encoding="utf-8")
          print("REAL_ENCORE_HOME_SCREENSHOT_PREPARED")
          PY

      - name: Persist real Home capture and README links on the same branch
        if: ${{ github.ref == 'refs/heads/dev/ps5-sparse-jit' }}
        run: |
          git add assets/screenshots/encore-home.png README.md README.fr.md
          if git diff --cached --quiet; then
            echo "Native screenshot is unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs(ui): replace decorative hero with actual Home screenshot [skip ci]"
          git push origin HEAD:dev/ps5-sparse-jit
