name: Verify PS Glyph Reconstruction (host only)
on:
  push:
    branches: [dev/ps5-sparse-jit]
    paths:
      - .github/workflows/check-ps-glyph-reconstruct.yml
      - tools/ps-glyph-scene-positions.py
      - tools/check-ps-glyph-scene-positions.py
      - tools/ps-glyph-cross-platform-image.py
      - tools/check-ps-glyph-cross-platform-image.py
      - tools/ps-glyph-reconstruct.py
      - tools/check-ps-glyph-reconstruct.py
      - tools/ps-glyph-diff-to-evidence.py
      - tools/check-ps-glyph-diff-to-evidence.py
      - tools/ps-glyph-mod-diff.py
      - tools/ps-glyph-scan.py
      - tools/ps-glyph-botw-yaz0.py
      - tools/check-ps-glyph-botw-yaz0.py
      - tools/ps-glyph-botw-archive-diff.py
      - tools/check-ps-glyph-botw-archive-diff.py
      - tools/ps-glyph-sarc-inspect.py
      - tools/ps-glyph-sarc-bntx-chain.py
      - tools/check-ps-glyph-sarc-inspect.py
      - headless/button_mapping.h
      - headless/main.cpp
      - tools/check-controller-semantic-mapping.py
      - docs/PS_GLYPH_SOURCE_INDEX.json
      - docs/PS_GLYPH_CROSS_PLATFORM_INDEX.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glyph-host-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host fixture dependencies (not a PS5 build)
        run: |
          python3 -m pip install --user --break-system-packages Pillow
      # Host-only cross-console source layout regression; deliberately no native PS5 compile.
      - name: Verify same-game PS4/Switch positions across layout/scaled art
        run: |
          python3 -B tools/check-ps-glyph-scene-positions.py
          python3 -B tools/check-ps-glyph-cross-platform-image.py
      - name: Verify cross-platform semantics and strict pixel provenance
        run: |
          python3 -B tools/check-ps-glyph-reconstruct.py
      - name: Verify mod pixel differences reconstruct safe, unapproved Switch sprite candidates
        run: |
          python3 -B tools/check-ps-glyph-diff-to-evidence.py
      - name: Verify BOTW Yaz0 to SARC/BNTX resource discovery and parser guards
        run: |
          python3 -B tools/check-ps-glyph-botw-yaz0.py
          python3 -B tools/check-ps-glyph-botw-archive-diff.py
          python3 -B tools/check-ps-glyph-sarc-inspect.py
      - name: Verify action glyphs match physical-to-guest HID mappings
        run: |
          python3 -B tools/check-controller-semantic-mapping.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          main = (root / 'headless/main.cpp').read_text()
          header = (root / 'headless/button_mapping.h').read_text()
          assert 'CompatibleWithPlayStationActionGlyphs' in header
          assert 'playstation_glyph_mapping() &&' in main
          assert 'std::any_of(glyph_catalogue.rules.begin(), glyph_catalogue.rules.end()' in main
          print('PASS: glyph admission matches fixed session profile, unsupported games do not reread preferences')
          PY
      - name: Aggregate all game/mod candidates without enabling unknown ones
        run: |
          python3 -B tools/ps-glyph-reconstruct.py index > /tmp/eden-glyph-leads.json
          python3 - <<'PY'
          import json
          with open('/tmp/eden-glyph-leads.json', encoding='utf-8') as stream:
              data = json.load(stream)
          assert data['game_count'] >= 18
          assert data['verified_reconstruction_specs_from_public_indices'] == 0
          print('SOURCE INDEX', data['game_count'], 'Switch game families')
          PY
