name: One-time verified ancestor-branch cleanup

on:
  push:
    branches: [dev/ps5-sparse-jit]

permissions:
  contents: read

jobs:
  delete-legacy-branch:
    # Explicitly fenced to a single deliberate cleanup commit.
    if: ${{ contains(github.event.head_commit.message, '[branch-cleanup-approved]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - name: Verify immutable legacy SHA and its ancestor relationship
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          NEW_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected=c3511903649a350a38dba375e5f8ad567d89c557
          api="https://api.github.com/repos/$GH_REPOSITORY"
          legacy_ref="heads/local/fc27-offline-no-build"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/git/ref/$legacy_ref" -o /tmp/eden-legacy-ref.json
          actual=$(python3 -c 'import json; print(json.load(open("/tmp/eden-legacy-ref.json"))["object"]["sha"])')
          test "$actual" = "$expected"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/compare/$expected...$NEW_HEAD" -o /tmp/eden-legacy-compare.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/eden-legacy-compare.json"))
          assert data["behind_by"] == 0, "Legacy branch not wholly contained in active branch"
          assert data["status"] in ("ahead", "identical"), data["status"]
          print("PASS legacy branch is an ancestor of the active developer HEAD")
          PY
          # No open PR may still depend on the branch.
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/pulls?state=open&per_page=100" -o /tmp/eden-open-prs.json
          python3 - <<'PY'
          import json
          prs = json.load(open("/tmp/eden-open-prs.json"))
          assert not any(p.get("head", {}).get("ref") == "local/fc27-offline-no-build"
                         for p in prs), "An open PR still uses the legacy branch"
          print("PASS no open PR points at legacy branch")
          PY
      - name: Delete only the verified obsolete ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GH_REPOSITORY"
          status=$(curl -sS -o /tmp/eden-delete-response -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/git/refs/heads/local/fc27-offline-no-build")
          if [ "$status" != "204" ]; then
            cat /tmp/eden-delete-response
            echo "Legacy branch delete refused: HTTP $status" >&2
            exit 1
          fi
          echo "PASS: removed only heads/local/fc27-offline-no-build"
