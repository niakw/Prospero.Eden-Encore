name: Publish validated PS5 build

# Separate publication job: download a previously GREEN native artifact.
# Never rebuild from HEAD and never silently publish a different source SHA.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Green native build run ID containing the app artifact"
        type: string
        required: true
        default: "38752177232"
      source_sha:
        description: "Exact 40-character git SHA compiled by that build"
        type: string
        required: true
        default: "5629395324ff65c98b50c44f35f2142a4a92654a"
  push:
    branches:
      - dev/ps5-sparse-jit
    paths:
      - .github/workflows/publish-validated-build.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: validated-native-release
  cancel-in-progress: false

jobs:
  publish-validated-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '38752177232' }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || '5629395324ff65c98b50c44f35f2142a4a92654a' }}
      ARTIFACT_NAME: Prospero.Eden-Encore-PS5-all-on-test
    steps:
      - name: Verify immutable green source build and artifact
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid source run ID"; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected full 40-character source SHA"; exit 1; }
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          actual_sha=$(jq -r '.head_sha' <<< "$run_json")
          branch=$(jq -r '.head_branch' <<< "$run_json")
          status=$(jq -r '.status' <<< "$run_json")
          result=$(jq -r '.conclusion' <<< "$run_json")
          workflow=$(jq -r '.name' <<< "$run_json")
          if [[ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ||
                "$branch" != "dev/ps5-sparse-jit" ||
                "$status" != "completed" || "$result" != "success" ||
                "$workflow" != "Encore native build and package" ]]; then
            echo "::error::Not the approved green native build: sha=$actual_sha branch=$branch status=$status conclusion=$result workflow=$workflow"
            exit 1
          fi
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
          count=$(jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "$artifacts")
          [[ "$count" == "1" ]] || { echo "::error::Expected one unexpired app artifact, found $count"; exit 1; }
          short="${EXPECTED_SOURCE_SHA:0:8}"
          echo "tag=encore-test-$short" >> "$GITHUB_OUTPUT"
          echo "zip=Eden-Encore-$short-PPSA99008.zip" >> "$GITHUB_OUTPUT"
          echo "Approved run $SOURCE_RUN_ID, source $EXPECTED_SOURCE_SHA, artifact $ARTIFACT_NAME"

      - name: Download exact approved PS5 application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Prospero.Eden-Encore-PS5-all-on-test
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: pinned-app

      - name: Verify, archive and checksum native folder
        id: package
        shell: bash
        env:
          ZIP_NAME: ${{ steps.verify.outputs.zip }}
        run: |
          set -euo pipefail
          test -s pinned-app/PPSA99008/eboot.bin
          test -s pinned-app/PPSA99008/sce_sys/param.json
          test -d pinned-app/PPSA99008/ui
          test -f pinned-app/PPSA99008/core-homebrew.nro
          [[ "$(find pinned-app -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]] || { echo "::error::Unexpected archive root"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          app = Path('pinned-app/PPSA99008')
          data = json.loads((app / 'sce_sys/param.json').read_text())
          assert data.get('titleId') == 'PPSA99008', data.get('titleId')
          assert (app / 'eboot.bin').stat().st_size > 1_000_000
          print('PASS: matching native title ID and executable')
          PY
          mkdir -p dist
          (cd pinned-app && zip -qrX "../dist/$ZIP_NAME" PPSA99008)
          unzip -tq "dist/$ZIP_NAME" >/dev/null
          (cd dist && sha256sum "$ZIP_NAME" > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo "Archive root: PPSA99008/"
          echo "File count: $(find pinned-app/PPSA99008 -type f | wc -l)"

      - name: Write transparent pre-release notes
        env:
          SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
          EXPECTED_SOURCE_SHA: ${{ env.EXPECTED_SOURCE_SHA }}
        shell: bash
        run: |
          cat > dist/RELEASE-NOTES.md <<EOF
          # Eden Encore — validated native PS5 test package

          **Source SHA:** \`$EXPECTED_SOURCE_SHA\`

          **Successful native CI:** https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID

          This ZIP is repackaged from the *existing successful CI artifact*,
          without recompiling or changing \`PPSA99008/\`.
          It is a **test pre-release**, not a stable R1.

          The selected All-On test build compiles shared and successor-batch JIT
          and materializes active I-cache and host service-wait fixes.
          The unsafe dummy-thread wait patch remains excluded. Source/build
          verification is not evidence that gameplay freezes, HUD delays or
          cold-start stutters are fixed on the physical console.

          Install the files from \`PPSA99008/\` to the matching application
          directory. Do not rename the title ID.

          \`SHA256SUMS\` checks the downloadable ZIP archive.
          EOF

      - name: Publish immutable test GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.verify.outputs.tag }}
          ZIP_NAME: ${{ steps.verify.outputs.zip }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite immutable assets."
            exit 0
          fi
          gh release create "$TAG"             "dist/$ZIP_NAME"             "dist/SHA256SUMS"             --repo "$GITHUB_REPOSITORY"             --target "$EXPECTED_SOURCE_SHA"             --title "Eden Encore PS5 test ($TAG)"             --notes-file dist/RELEASE-NOTES.md             --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease

      - name: Explain missing GitHub publication permission
        if: failure()
        run: |
          echo "::error::If gh release create returns HTTP 403, set Settings > Actions > General > Workflow permissions to Read and write permissions, then Re-run failed jobs. The pinned green build does not need rebuilding."
