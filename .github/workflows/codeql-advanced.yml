# Dedicated advanced CodeQL setup for this personal-account repository.
# Requires switching GitHub's existing *default* CodeQL setup to advanced.
# First-party and active renderer code remain in scope.
name: Eden Encore CodeQL Advanced
on:
  push:
    branches: [dev/ps5-sparse-jit]
  pull_request:
    branches: [dev/ps5-sparse-jit]
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 2'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: none
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}/setup:advanced
