name: Finalize archived fork redirect — remove mirrored legacy branch pointers
on:
  push:
    branches: [dev/ps5-sparse-jit]
    paths: ['.github/workflows/finalize-fork-redirect.yml']
permissions:
  contents: write
jobs:
  prune-mirrored-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify standalone repo preserves all three secondary active branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          old='https://github.com/niakw/Prospero.Eden-Encore.git'
          new='https://github.com/niakw/ProsperoEden-Encore.git'
          test "$(gh api repos/niakw/ProsperoEden-Encore --jq .fork)" = false
          test "$(gh api repos/niakw/Prospero.Eden-Encore --jq .stargazers_count)" -ge 8
          for name in feat/graphics-network-achievements fix/ps5-launcher-avatar-recovery research/ns2-ps5-compatibility; do
            nsha="$(git ls-remote "${new}" "refs/heads/${name}" | awk '{print $1}')"
            osha="$(git ls-remote "${old}" "refs/heads/${name}" | awk '{print $1}')"
            test "${#nsha}" = 40
            test "${#osha}" = 40
            echo "PRESERVED ${name}: old=${osha} new=${nsha}"
          done
          for tag in encore-R1-56293953 encore-test-56293953; do
            gh api "repos/niakw/ProsperoEden-Encore/releases/tags/${tag}" --jq '.assets | length' | grep -qx 2
          done
      - name: Delete only the obsolete fork secondary branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q "${RUNNER_TEMP}/redirect-refs"
          git -C "${RUNNER_TEMP}/redirect-refs" push --atomic 'https://github.com/niakw/Prospero.Eden-Encore.git' \
            ':refs/heads/feat/graphics-network-achievements' \
            ':refs/heads/fix/ps5-launcher-avatar-recovery' \
            ':refs/heads/research/ns2-ps5-compatibility'
          echo 'Old fork secondary branches deleted; historic tags, releases, PRs and stars retained.' >> "${GITHUB_STEP_SUMMARY}"
