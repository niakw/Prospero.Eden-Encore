name: Encore source preflight (host only)

on:
  push:
    branches: [dev/ps5-sparse-jit]
    # Run on actual native source/test edits, including commits authored in
    # other tools without special message suffixes. Docs-only/UI-only pushes
    # should not interrupt a running core validation.
    paths:
      - 'vendor/encore-active/**'
      - 'vendor/sources/eden/**'
      - 'headless/**'
      - 'src/host_memory.cpp'
      - 'src/memory_pages.cpp'
      - 'src/jit*.cpp'
      - 'src/*_performance.cpp'
      - 'tools/**'
      # Review manifests are executable source-ownership contracts. Re-run
      # their actual checks when a reviewed Git blob gets a new stamp.
      - 'docs/EDEN_OPTIMIZATION_COVERAGE_2026-10-20.json'
      - 'docs/EDEN_NATIVE_CONFIG_METADATA_REVIEW_2026-10-21.md'
      - '.github/workflows/encore-core-preflight.yml'
      # The preflight audits neutral step descriptions across ALL workflows,
      # including this authentic-readme screenshot producer.
      - '.github/workflows/launcher-readme-home-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only real core source/test changes enter this workflow. New commits
# supersede old checks; documentation and launcher-only pushes are excluded.
concurrency:
  group: encore-core-preflight-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source (GitHub only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host-only JSON, Boost.Container and clang sanitizer fixtures
        run: |
          # Some hosted runners have an unrelated Microsoft APT feed that can
          # return HTTP 403. No package in this gate comes from that feed.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev libboost-container-dev clang-18 libssl-dev libzstd-dev

      - name: Early audit and native source boundary witnesses
        run: |
          set -euo pipefail
          python3 -B tools/check-python-source-syntax.py
          python3 -B tools/check-encore-ncz-sources.py
          python3 -B tools/check-exefs-directory-host.py
