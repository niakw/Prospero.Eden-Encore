          python3 -B tools/check-ps5-pad-input-chain.py
          python3 -B tools/check-ps5-npad-pause-r435.py
          python3 -B tools/check-ps5-guest-system-buttons.py
          python3 -B tools/check-ps5-freebsd11-ule-topology.py
          python3 -B tools/check-ps5-freeze-witness.py
          python3 -B tools/check-runtime-frame-budget.py
          python3 -B tools/check-universal-emulation-policy.py
          python3 -B tools/check-network-domain-policy.py
          python3 -B tools/check-network-accepted-audit.py
          python3 -B tools/analyze-ps5-network-audit.py --self-test
