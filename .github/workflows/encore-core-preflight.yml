          python3 -B tools/check-vendored-vulkan-fork.py
          python3 -B tools/check-vendor-consolidation-debt.py
          python3 -B tools/check-vendored-native-build-cmake.py
          python3 -B tools/check-vendored-fiber-source.py
          python3 -B tools/check-native-link-weak-flags.py
          python3 -B tools/check-vendored-texture-header.py
          python3 -B tools/check-vendored-jit-assert-source.py
          python3 -B tools/install-vendored-eden-build-flags.py
          python3 -B tools/check-native-build-recipe.py
          python3 -B tools/check-ps5-tfb-counter-stability.py
          python3 -B tools/check-vendored-radv-fork.py
          python3 -B tools/check-ps5-mesa-shader-cache.py
          python3 -B tools/check-ps5-radv-kick-coalescing.py
          python3 -B tools/check-radv-mesa-2624-bin-height.py
          python3 -B tools/check-radv-mesa-2622-texture-array.py
          python3 -B tools/check-radv-official-indirect-draw.py
          python3 -B tools/check-radv-mesa-2624-ds-aspects.py
          python3 -B tools/check-radv-immutable-sampler-lifetime.py
          python3 -B tools/check-ps5-videoout-120hz-offer.py
          python3 -B tools/check-ps5-videoout-unpresented-takeover.py
          python3 -B tools/check-vendored-gpu-thread.py
          python3 -B tools/analyze-fc27-stutter.py --self-test
          python3 -B tools/check-nvnflinger-dequeue-wakeup.py
          python3 -B tools/check-surface-lifecycle.py
          python3 -B tools/check-ps5-descriptor-queue-preflight.py
          python3 -B tools/check-ps5-large-descriptor-preflight.py
          python3 -B tools/check-ps5-adjacent-texture-view-reuse.py
          python3 -B tools/check-ps5-alias-current-tick.py
          python3 -B tools/check-ps5-texture-subphases.py
          python3 -B tools/check-ps5-descriptor-ring-preflight.py
          python3 -B tools/check-ps5-descriptor-capacity-preflight.py
          python3 -B tools/check-ps5-software-bilinear.py
