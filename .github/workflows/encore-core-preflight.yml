name: Encore source preflight (host only)

on:
  push:
    branches: [dev/ps5-sparse-jit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encore-core-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[core-ready]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source (GitHub only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host-only JSON, Boost.Container and clang sanitizer fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev libboost-container-dev clang-18

      - name: Audit generic graphics, JIT, runtime and filtered game networking
        run: |
          set -euxo pipefail
          python3 -B tools/check-python-source-syntax.py
          python3 -B tools/check-ci-neutral-labels.py
          python3 -B tools/check-upstream-coverage-inventory.py
          python3 -B tools/update-upstream-comparison.py --self-test
          python3 -B tools/check-ps5-log-analysis.py
          python3 -B tools/check-ps5-frame-window-analysis.py
          python3 -B tools/check-game-frame-summary.py
          python3 -B tools/check-ps5-vulkan-dispatch-ceiling.py
          python3 -B tools/check-ps5-vulkan-cache-phases.py
          python3 -B tools/check-ps5-build-sha-provenance.py
          python3 -B tools/check-ps5-guest-cache-domains.py
          python3 -B tools/check-ps5-guest-write-subphases.py
          python3 -B tools/check-ps5-guest-write-batching.py
          python3 -B tools/check-ps5-guest-ipc-thread-profile.py
          python3 -B tools/analyze-fc27-ipc-threads.py --self-test
          python3 -B tools/analyze-guest-progress-stall.py --self-test
          python3 -B tools/check-ps5-fast-first-pipelines.py
          python3 -B tools/check-ps5-pipeline-build-wait.py
          python3 -B tools/check-ps5-pipeline-fairness.py
          python3 -B tools/check-upstream-texture-memory-r428.py
          python3 -B tools/check-ps5-image-pages-r433.py
          python3 -B tools/check-ps5-buffer-pages-r437.py
          python3 -B tools/check-ps5-present-phase-timing.py
          python3 -B tools/check-ps5-first-use-draw-preservation.py
          python3 -B tools/check-ps5-gpu-worker-draw-guard.py
          python3 -B tools/check-ps5-scheduler-capacity-preflight.py
          python3 -B tools/check-ps5-quiet-frame-pressure.py
          python3 -B tools/check-ps5-gpu-active-wait-host.py
          python3 -B tools/apply-upstream-4473.py --self-test
          python3 -B tools/check-ps5-quiet-cpu-io-clocks.py
          python3 -B tools/check-ps5-quiet-guest-entry.py
          python3 -B tools/check-upstream-guest-scheduler-locks.py
          python3 -B tools/check-ps5-quiet-gpu-hotpaths.py
          python3 -B tools/check-ps5-upstream-fixes-r302.py
          python3 -B tools/check-ps5-quiet-jit-timers.py
          python3 -B tools/check-ps5-gpu-producer-wake.py
          python3 -B tools/check-ps5-native-load-replay.py
          python3 -B tools/check-ps5-native-timing-replay.py
          python3 -B tools/check-ps5-display-vs-guest-fps.py
          python3 -B tools/check-ps5-async-present-source-stress.py
          python3 -B tools/check-ps5-vulkan-present-submit-contention.py
          python3 -B tools/check-ps5-buffer-dequeue-generation.py
          python3 -B tools/check-ps5-buffer-presentation-state-space.py
          python3 -B tools/check-ps5-vulkan-worker-wake.py
