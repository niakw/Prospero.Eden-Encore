          python3 -B tools/check-controller-semantic-mapping.py
          python3 -B tools/check-ps5-title-controls.py
          python3 -B tools/check-fc27-match-input-profile.py
          python3 -B tools/check-ps5-pad-freeze-observability.py
          python3 -B tools/check-ps5-autocontrol-context.py
          python3 -B tools/check-gpu-native-diagnostics.py
          python3 -B tools/check-gpu-memory-mapping-source.py
          python3 -B tools/check-gpu-backport-replay-host.py
          python3 -B tools/check-eden-atomic-cache-refresh-host.py
          python3 -B tools/check-ps5-guest-null-backing-host.py
          python3 -B tools/check-guest-backport-replay-host.py
          python3 -B tools/check-ps5-nvmap-alloc-replay.py
          python3 -B tools/check-ps5-texture-descriptor-guard.py
          python3 -B tools/check-ps5-null-texture-view-revival.py
          python3 -B tools/check-ps5-feedback-loop-view-cache.py
          python3 -B tools/check-ps5-present-equal-copy.py
          python3 -B tools/check-ps5-vulkan-layer-lifetime.py
          python3 -B tools/check-ps5-vulkan-aa-lifetime.py
          python3 -B tools/check-ps5-vulkan-stride-reallocation.py
