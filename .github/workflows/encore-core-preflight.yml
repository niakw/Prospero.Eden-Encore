          python3 -B tools/check-vulkan-cache-atomic.py
          python3 -B tools/check-jit-dense-alias-host.py
          python3 -B tools/check-jit-sparse-host.py
          python3 -B tools/check-sparse-index-boundary.py
          python3 -B tools/check-sparse-slot-reuse-host.py
          python3 -B tools/check-shader-cache-pressure.py
          python3 -B tools/check-gc-scan.py
          python3 -B tools/check-gc-prefetch-budget.py
          python3 -B tools/check-vulkan-gc-budget-host.py
          python3 -B tools/check-vulkan-gc-prefetch-host.py
          python3 -B tools/check-vulkan-gc-mixed-prefetch-host.py
          python3 -B tools/check-vulkan-readback-small-vector-host.py
          python3 -B tools/check-vulkan-readback-batch-integration-host.py
          python3 -B tools/check-vulkan-pipeline-trace-thread-host.py
          python3 -B tools/check-vulkan-present-wait-host.py
          python3 -B tools/check-vulkan-present-source-replay-host.py
          python3 -B tools/check-log-budget.py
          python3 -B tools/check-bounded-logs.py
          python3 -B tools/check-nlib-media-safety.py
          python3 -B tools/check-ci-cache.py
          python3 -B tools/check-package-flexible-memory.py

      - name: Verify native memory arena ownership (host sanitizers only)
        run: |
          set -euxo pipefail
          python3 -B tools/check-heap-growth.py
          python3 -B tools/check-heap-growth-rollback-host.py
          python3 -B tools/check-heap-growth-diagnostics-host.py
          python3 -B tools/check-crash-provenance-host.py

      - name: Check approved user-facing UX invariants (no graphics compilation)
        run: |
          set -euxo pipefail
          python3 -B tools/check-native-ui-focus.py
          python3 -B tools/check-home-reference.py
          python3 -B tools/check-ps5-launcher-r385.py
          python3 -B tools/check-launcher-translation-coverage.py
          python3 -B tools/check-home-media.py
          python3 -B tools/check-encore-ux.py
          python3 -B tools/check-ps5-ui-controls-per-game.py
          python3 -B tools/check-dualsense-artwork.py
          python3 -B tools/check-ps-glyph-cross-platform-index.py

      - name: Validate dev changes against archived release baseline
        run: |
          # The old fix branch was intentionally removed during the single-dev
          # cleanup. Compare to its preserved annotated tag, not a deleted ref.
          git fetch --no-tags --depth=1 origin refs/tags/archive/fix-0.40-20261012
          # Full pristine vendor trees retain upstream whitespace verbatim.
          # Keep strict diffs for all Encore-owned source, CI and vendor docs,
          # but never silently rewrite external pinned source snapshots or packs.
          git diff --check FETCH_HEAD HEAD -- . ':(exclude)vendor/sources/**' ':(exclude)vendor/objects/**' ':(exclude)vendor/encore-active/**'
          echo CORE_PREFLIGHT_ALL_PASS
