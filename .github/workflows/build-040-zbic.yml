name: Build 0.40 ZBIC test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eden-040-improved-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools llvm-spirv-18 libllvmspirvlib-18-dev \
            cmake ninja-build ccache make nasm meson rsync git \
            glslang-tools spirv-tools bison flex curl wget unzip librsvg2-bin imagemagick \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config

      - name: Upgrade Meson
        run: |
          python3 -m pip install --user --break-system-packages "meson>=1.4,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Check toolchain
        run: make toolchain

      - name: Restore build caches
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            .deps
            ../ps5-native-app-boilerplate
            ../mihawk-vulkan-review
            ../mihawk-mesa-review
            ../mihawk-sdk-review
          key: prosperoeden-040-zbic-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}
          restore-keys: |
            prosperoeden-040-zbic-${{ runner.os }}-

      - name: Build release
        run: make release JOBS=4

      - name: Save build caches even on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            .deps
            ../ps5-native-app-boilerplate
            ../mihawk-vulkan-review
            ../mihawk-mesa-review
            ../mihawk-sdk-review
          key: prosperoeden-040-zbic-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}

      - name: Upload ProsperoEden 0.40 ZBIC build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProsperoEden-0.40-ZBIC
          path: |
            dist/
            build/symbols/
          retention-days: 7
