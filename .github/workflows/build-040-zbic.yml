name: Build 0.40 ZBIC test

on:
  push:
    branches:
      - fix/0.40-zbic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 lld-18 llvm-18 llvm-18-tools llvm-spirv-18 libllvmspirvlib-18-dev \
            cmake ninja-build ccache make nasm meson rsync git \
            glslang-tools spirv-tools bison flex curl wget unzip \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config

      - name: Upgrade Meson
        run: |
          python3 -m pip install --user --break-system-packages "meson>=1.4,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Check toolchain
        run: make toolchain

      - name: Build release
        run: make release JOBS=4

      - name: Upload ProsperoEden 0.40 ZBIC build
        uses: actions/upload-artifact@v4
        with:
          name: ProsperoEden-0.40-ZBIC
          path: |
            dist/
            build/symbols/
          retention-days: 7
