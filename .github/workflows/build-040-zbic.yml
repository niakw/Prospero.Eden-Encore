name: Encore native build and package

on:
  push:
    branches:
      - dev/ps5-sparse-jit
      # On dev, build job is gated by the explicit [full-build] marker below.
      # Ordinary dev commits do not compile or publish a native app.
  # workflow_dispatch remains available for deliberate build / stage-resume.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the green build as a GitHub Release
        required: false
        type: boolean
        default: false
      resume_run_id:
        description: Optional run ID whose verified internal stage checkpoint should be reused
        required: false
        type: string
        default: ""
      build_only:
        description: Skip already-green validation gates and go straight to native prepare/build
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# A skipped dev push must not cancel a running explicit native build.
# Distinguish build-capable commits from ordinary UI/docs pushes, while
# preserving one-at-a-time supersession for deliberate native candidates.
# workflow_dispatch is already isolated by its event name.
concurrency:
  group: encore-native-${{ github.ref }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/dev/ps5-sparse-jit' && github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[full-build]') && !contains(github.event.head_commit.message || '', '[resume-stage:37728435816]')) && 'skip-only' || 'build-capable' }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{ !contains(github.event.head_commit.message || '', '[publish-existing]') &&
          (github.ref == 'refs/heads/dev/ps5-sparse-jit' &&
           github.event_name == 'workflow_dispatch' ||
           contains(github.event.head_commit.message || '', '[full-build]') ||
           contains(github.event.head_commit.message || '', '[resume-stage:37728435816]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PROSPEROEDEN_GIT_DEPS_ROOT: .deps/repos
      PROSPEROEDEN_DEPS_OFFLINE: '1' # source dependency pulls must never contact upstream
      EDEN_STAGE_DIR: build/release/PPSA99008
      # GitHub-only push resume for an already compiled staged app. This marker
      # is one-shot and cannot alter the downloaded binary or publish a release.
      RESUME_STAGE_RUN_ID: ${{ contains(github.event.head_commit.message || '', '[resume-stage:37728435816]') && '37728435816' || inputs.resume_run_id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # R revisions are sparse across documentation and CI commits.
          # Full history is required for an honest first-parent revision search.
          # The derivation fails closed when no R revision exists.
          fetch-depth: 0

      # Fail on source/ownership drift before apt, SDK staging, or shader builds.
      # These pure-Python witnesses need only the versioned checkout and must
      # not modify the pinned vendor tree or any cached dependency archive.
      - name: Early native source ownership and cache replay gate
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          python3 -B tools/check-vendor-consolidation-debt.py
          python3 -B tools/check-vendored-eden-cache-rebase-host.py

      - name: Install build toolchain
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools llvm-spirv-18 libllvmspirvlib-18-dev \
            cmake ninja-build ccache make nasm meson rsync git \
            glslang-tools spirv-tools bison flex autoconf binutils coreutils util-linux \
            curl wget unzip librsvg2-bin imagemagick \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config \
            libboost-container-dev
          # The host core gate already installed Boost.Container; the native
          # workflow did not. Verify the real C++ include before lengthy
          # Vulkan readback/prefetch checks or PS5 SDK compilation.
          printf '#include <boost/container/small_vector.hpp>\n' |
            clang++-18 -std=c++20 -x c++ -fsyntax-only -

      - name: Verify NCZ source ownership and compressed-content decoding
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends libssl-dev libzstd-dev
          python3 -B tools/check-encore-ncz-sources.py
          python3 -B tools/check-ncz.py

      - name: Upgrade Meson
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: |
          python3 -m pip install --user --break-system-packages "meson==1.12.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Check toolchain
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: make toolchain

      - name: Validate launcher translations and locale runtime
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: |
          python3 -B tools/launcher/strings.py check
          python3 -B tools/check-language-runtime.py
          python3 -B tools/check-launcher-translation-coverage.py

      - name: Restore build caches
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}
          restore-keys: |
            prospero-eden-encore-040-${{ runner.os }}-
            prosperoeden-040-zbic-${{ runner.os }}-

      - name: Prepare cacheable sibling dependency paths
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: bash tools/ci/link-sibling-deps.sh

      - name: Validate release metadata and legal bundle
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: |
          python3 -B tools/ci/check-repo-hygiene.py
          python3 -B tools/ci/check-native-boilerplate-setup.py
          python3 -B tools/ci/check-release-metadata.py
          python3 -B tools/ci/check-licenses.py

      - name: Validate startup, elevation and storage contracts
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: |
          # Collect ALL independent source/harness failures in this one run,
          # but fail the gate if any check fails. Never bypass verification.
          set +e
          validation_failed=0
          trap 'rc=$?; echo "::error::Validation failed (exit $rc): $BASH_COMMAND"; validation_failed=1' ERR
          python3 -B tools/check-startup-contract.py
          python3 -B tools/check-filesystem-probe.py
          python3 -B tools/check-storage-contract.py
          python3 -B tools/check-legacy-migration.py
          python3 -B tools/check-video-presets.py
          python3 -B tools/check-encore-ux.py
          python3 -B tools/check-native-ui-focus.py
          python3 -B tools/check-jit-stability.py
          python3 -B tools/check-experimental-performance.py
          python3 -B tools/check-gc-scan.py
          python3 -B tools/check-gc-prefetch-budget.py
          python3 -B tools/check-ps5-all-on-contract.py
          python3 -B tools/check-ps5-architecture.py
          python3 -B tools/check-python-source-syntax.py
          # Native allocation ownership and 3 GiB VA/128 MiB PA rollback
          # require their real 8-thread UBSan/TSan host harness, not just
          # source-string contracts. Installed clang-18 above.
          python3 -B tools/check-heap-growth.py
          python3 -B tools/check-heap-growth-rollback-host.py
          python3 -B tools/check-heap-growth-diagnostics-host.py
          python3 -B tools/check-crash-provenance-host.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev
          python3 -B tools/sync-glyph-overrides.py --manifest data/glyph-overrides.json --check
          python3 -B tools/check-glyph-overrides-runtime.py
          python3 -B tools/check-addon-snapshot-host.py
          python3 -B tools/check-ps-glyph-packs.py
          python3 -B tools/check-controller-semantic-mapping.py
          python3 -B tools/check-ps5-pad-freeze-observability.py
          python3 -B tools/check-ps5-autocontrol-context.py
          python3 -B tools/check-ps5-live-input.py
          python3 -B tools/check-ps5-interactive-boot.py
          python3 -B tools/check-ps5-ui-stream-buffer.py
          python3 -B tools/check-ps5-ui-controls-per-game.py
          python3 -B tools/check-dualsense-artwork.py
          python3 -B tools/check-ps-glyph-cross-platform-index.py
          python3 -B tools/check-vulkan-shader-workers.py
          python3 -B tools/check-vulkan-shader-workers-cpp-host.py
          python3 -B tools/check-worker-topology.py
          python3 -B tools/check-worker-affinity.py
          python3 -B tools/check-ps5-pad-input-chain.py
          python3 -B tools/check-ps5-guest-system-buttons.py
          python3 -B tools/check-ps5-dev-cache-contention.py
          python3 -B tools/check-gpu-native-diagnostics.py
          python3 -B tools/check-gpu-physical-copy-bounds-host.py
          python3 -B tools/check-gpu-physical-copy-cpp-host.py
          python3 -B tools/check-gpu-atomic-forward-cpp-host.py
          python3 -B tools/check-gpu-asid-lifetime-cpp-host.py
          python3 -B tools/check-gpu-memory-mapping-source.py
          python3 -B tools/check-gpu-backport-replay-host.py
          python3 -B tools/check-eden-atomic-cache-refresh-host.py
          python3 -B tools/check-ps5-guest-null-backing-host.py
          python3 -B tools/check-guest-backport-replay-host.py
          python3 -B tools/check-ps5-nvmap-alloc-replay.py
          python3 -B tools/check-ps5-texture-descriptor-guard.py
          python3 -B tools/check-ps5-null-texture-view-revival.py
          python3 -B tools/check-ps5-feedback-loop-view-cache.py
          python3 -B tools/check-ps5-buffer-clean-upload-host.py
          python3 -B tools/check-ps5-compute-descriptor-scratch-host.py
          python3 -B tools/check-ps5-compute-sampler-memo-host.py
          python3 -B tools/check-ps5-texture-page-range-host.py
          python3 -B tools/check-ps5-texture-tic-layer-host.py
          python3 -B tools/check-ps5-remapped-texture-view-host.py
          python3 -B tools/check-ps5-texture-ordered-backports-host.py
          python3 -B tools/check-ps5-remapped-render-target-host.py
          python3 -B tools/check-ps5-present-equal-copy.py
          python3 -B tools/check-ps5-vulkan-layer-lifetime.py
          python3 -B tools/check-ps5-vulkan-aa-lifetime.py
          python3 -B tools/check-ps5-vulkan-stride-reallocation.py
          python3 -B tools/check-ps5-vulkan-raw-view-lifetime.py
          python3 -B tools/check-ps5-vulkan-present-frame-lifetime.py
          python3 -B tools/check-ps5-vulkan-present-retry-liveness.py
          python3 -B tools/check-ps5-vulkan-swapchain-snapshot.py
          python3 -B tools/check-ps5-vulkan-swapchain-acquire-bounds.py
          python3 -B tools/check-ps5-native-acquire-failfast.py
          python3 -B tools/check-ps5-mihawk-radv-contract.py
          python3 -B tools/check-vendored-deps.py
          python3 -B tools/check-vendored-overrides.py
          python3 -B tools/check-vendored-opengl-deps.py
          python3 -B tools/vendor-eden-cpm.py --check
          python3 -B tools/install-vendored-eden-backports.py --replay
          python3 -B tools/check-surface-lifecycle.py
          python3 -B tools/check-vendored-vulkan-fork.py
          python3 -B tools/check-vendor-consolidation-debt.py
          python3 -B tools/check-maintained-logging-loader.py
          python3 -B tools/check-maintained-audio-units.py
          python3 -B tools/check-native-manual-run-isolation.py
          python3 -B tools/check-encore-first-parent-revision.py
          python3 -B tools/check-vendored-native-build-cmake.py
          python3 -B tools/check-vendored-fiber-source.py
          python3 -B tools/check-native-link-weak-flags.py
          python3 -B tools/check-vendored-texture-header.py
          python3 -B tools/check-vendored-jit-assert-source.py
          python3 -B tools/install-vendored-eden-build-flags.py
          python3 -B tools/check-native-build-recipe.py
          python3 -B tools/check-ps5-tfb-counter-stability.py
          python3 -B tools/check-ps5-guest-ipc-thread-profile.py
          python3 -B tools/analyze-fc27-ipc-threads.py --self-test
          python3 -B tools/analyze-guest-progress-stall.py --self-test
          python3 -B tools/check-vendored-radv-fork.py
          python3 -B tools/radv-active-inputs.py --self-test
          python3 -B tools/check-ps5-radv-kick-coalescing.py
          python3 -B tools/check-radv-mesa-2624-bin-height.py
          python3 -B tools/check-radv-mesa-2622-texture-array.py
          python3 -B tools/check-radv-official-indirect-draw.py
          python3 -B tools/check-radv-mesa-2624-ds-aspects.py
          python3 -B tools/check-radv-immutable-sampler-lifetime.py
          python3 -B tools/check-ps5-videoout-120hz-offer.py
          python3 -B tools/check-ps5-videoout-unpresented-takeover.py
          python3 -B tools/check-vendored-gpu-thread.py
          python3 -B tools/check-ps5-descriptor-queue-preflight.py
          python3 -B tools/check-ps5-large-descriptor-preflight.py
          python3 -B tools/check-ps5-adjacent-texture-view-reuse.py
          python3 -B tools/check-ps5-alias-current-tick.py
          python3 -B tools/check-ps5-texture-subphases.py
          python3 -B tools/check-ps5-descriptor-ring-preflight.py
          python3 -B tools/check-ps5-software-bilinear.py
          python3 -B tools/check-sparse-index-boundary.py
          python3 -B tools/check-sparse-slot-reuse-host.py
          python3 -B tools/check-jit-memory-policy.py
