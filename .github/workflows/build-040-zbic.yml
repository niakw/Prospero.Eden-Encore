          python3 -B tools/check-vulkan-cache-atomic.py
          # The dense JIT is no longer a valid PS5 execution path.
          python3 -B tools/check-native-sparse-jit-release-selector-host.py
          python3 -B tools/check-jit-sparse-host.py
          python3 -B tools/check-ps5-sparse-jit-va-lifetime.py
          python3 -B tools/check-ps5-direct-limit-host.py
          python3 -B tools/check-ps5-virtual-reservation-host.py
          python3 -B tools/check-shader-cache-pressure.py
          python3 -B tools/check-vulkan-gc-budget-host.py
          python3 -B tools/check-vulkan-gc-prefetch-host.py
          python3 -B tools/check-vulkan-gc-mixed-prefetch-host.py
          python3 -B tools/check-vulkan-readback-small-vector-host.py
          python3 -B tools/check-vulkan-readback-batch-integration-host.py
          python3 -B tools/check-vulkan-pipeline-trace-thread-host.py
          python3 -B tools/check-vulkan-present-wait-host.py
          python3 -B tools/check-vulkan-present-source-replay-host.py
          python3 -B tools/check-performance-policy.py
          python3 -B tools/check-ps5-quiet-cpu-io-clocks.py
          python3 -B tools/check-ps5-upstream-fixes-r302.py
          python3 -B tools/check-ps5-quiet-guest-entry.py
          python3 -B tools/check-ps5-direct-pool-host.py
          python3 -B tools/check-ps5-pc-ring-host.py
          python3 -B tools/check-ps5-worker-lifetime-host.py
          python3 -B tools/check-ps5-native-load-replay.py
          python3 -B tools/check-ps5-native-timing-replay.py
          python3 -B tools/check-fc27-stutter-regimes.py --self-test
          python3 -B tools/analyze-fc27-lock-wait-tails.py --self-test
          python3 -B tools/check-ps5-display-vs-guest-fps.py
          python3 -B tools/check-ps5-async-present-source-stress.py
          python3 -B tools/check-ps5-vulkan-present-submit-contention.py
          python3 -B tools/check-ps5-buffer-dequeue-generation.py
          python3 -B tools/check-ps5-buffer-presentation-state-space.py
          python3 -B tools/check-hle-counter-contention.py
          python3 -B tools/check-network-runtime.py
          python3 -B tools/check-guest-network-isolation.py
          python3 -B tools/check-nlib-media-safety.py
          python3 -B tools/check-nlib-ui-recovery.py
          python3 -B tools/check-ps5-log-analysis.py
          python3 -B tools/check-ps5-frame-window-analysis.py
          python3 -B tools/check-game-frame-summary.py
          python3 -B tools/check-ps5-vulkan-dispatch-ceiling.py
          python3 -B tools/check-ps5-vulkan-cache-phases.py
          python3 -B tools/check-ps5-fast-first-pipelines.py
          python3 -B tools/check-native-shader-cache-eligibility.py --self-test
          python3 -B tools/check-universal-emulation-policy.py
          python3 -B tools/check-runtime-frame-budget.py
          python3 -B tools/check-library-docked-snapshot-host.py
          python3 -B tools/check-fc27-hle-compat.py
          python3 -B tools/check-net-cache-migration.py
          python3 -B tools/check-ps5-net-unit.py
          python3 -B tools/check-home-reference.py
          python3 -B tools/check-ps5-launcher-r385.py
          python3 -B tools/check-home-media.py
          python3 -B tools/check-launch-case-artwork.py
          python3 -B tools/check-bounded-logs.py
          python3 -B tools/check-log-budget.py
          python3 -B tools/check-log-pipe-unit.py
          python3 -B tools/check-release-hotpath.py
          python3 -B tools/check-sm-host-wait.py
          python3 -B tools/check-dummy-thread-waits.py
          python3 -B tools/check-dynarmic-icache.py
          python3 -B tools/check-ps5-backport-policy.py
          python3 -B tools/check-upstream-guest-scheduler-locks.py
          python3 -B tools/check-game-liveness.py
          python3 -B tools/check-ps5-guest-fault-recovery.py
          python3 -B tools/check-fc27-trace.py
          python3 -B tools/check-ci-neutral-labels.py
          python3 -B tools/check-credit-attribution.py
          python3 -B tools/check-ci-cache.py
          python3 -B tools/check-package-flexible-memory.py
          if (( validation_failed )); then
            echo "::error::One or more source/host contracts failed; native build blocked"
            exit 1
          fi

      - name: Preflight release packaging
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: bash tools/ci/package-image.sh --prepare

      # Resume from an internal GitHub cache instead of an extra public
      # build artifact. Historical run artifacts remain a read-only fallback.
      - name: Restore internal stage checkpoint
        id: restore_stage
        if: ${{ env.RESUME_STAGE_RUN_ID != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/release/
          key: encore-internal-stage-v1-${{ runner.os }}-${{ env.RESUME_STAGE_RUN_ID }}

      - name: Restore historical staged artifact if no checkpoint exists
        if: ${{ env.RESUME_STAGE_RUN_ID != '' && steps.restore_stage.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Prospero.Eden-Encore-staged-app
          path: build/release/
          github-token: ${{ github.token }}
          run-id: ${{ env.RESUME_STAGE_RUN_ID }}

      - name: Normalize older flattened staged artifacts (restore only)
        if: ${{ env.RESUME_STAGE_RUN_ID != '' }}
        run: |
          set -euo pipefail
          # Former upload-artifact rooted at build/release/PPSA99008/ and
          # stripped the title directory. Preserve compatibility solely when
          # resuming these historical already-published artifacts.
          if [[ -f build/release/eboot.bin && ! -e build/release/PPSA99008 ]]; then
            mkdir -p build/release/PPSA99008
            shopt -s nullglob dotglob
            for item in build/release/*; do
              [[ $item == build/release/PPSA99008 ]] && continue
              mv -- "$item" build/release/PPSA99008/
            done
          fi
          test -f build/release/PPSA99008/eboot.bin
          test -f build/release/PPSA99008/sce_sys/param.json
          test ! -e build/release/eboot.bin

      - name: Prepare native build inputs
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: make prepare JOBS=4

      - name: Prepare local retail case index
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          python3 -B tools/launcher/build-box-art-index.py --self-test
          if python3 -B tools/launcher/build-box-art-index.py --download --output headless/prosperoeden/ui/box-art-index.tsv; then
            echo "Retail scan index ready (no full database shipped)"
          else
            # Network/catalog outages must never prevent an emulator build.
            rm -f headless/prosperoeden/ui/box-art-index.tsv
            echo "::warning::Optional case index unavailable; cached/user-provided artwork remains supported"
          fi

      - name: Build and stage native release
        id: stage
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        env:
          EDEN_SKIP_PREBUILD_SOURCE_CHECKS: ${{ inputs.build_only && '1' || '0' }}
        run: |
          set -euo pipefail
          bash tools/build-package.sh release-stage

      - name: Validate freshly built staged app
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        env:
          EDEN_PACKAGE_DIR: ${{ env.EDEN_STAGE_DIR }}
        run: |
          python3 -B headless/check_package.py --check
          python3 -B tools/ci/check-staged-app.py "$EDEN_STAGE_DIR"
          # Check the actual compiled sparse-only CMake profile and binary.
          python3 -B tools/ci/check-release-experiments.py "$EDEN_STAGE_DIR"

      # Save a *validated* stage as a cache checkpoint, not a second PS5 ZIP.
      # A cache outage must not invalidate an otherwise sound compiled app;
      # the final FTP artifact is separately uploaded and downloaded below.
      - name: Save internal stage checkpoint
        if: ${{ steps.stage.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/release/
          key: encore-internal-stage-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Validate resumed staged app
        if: ${{ env.RESUME_STAGE_RUN_ID != '' }}
        run: python3 -B tools/ci/check-staged-app.py build/release/PPSA99008

      - name: Assemble release files
        run: python3 -B tools/ci/make-dist.py build/release/PPSA99008

      - name: Verify release ZIP content paths
        if: ${{ success() }}
        run: python3 -B tools/ci/check-ftp-archive-root.py dist

      - name: Reject release folder wrappers or extra staged files
        if: ${{ success() }}
        run: |
          test "$(ls -A build/release)" = PPSA99008
          test -f build/release/PPSA99008/eboot.bin
          test -f build/release/PPSA99008/sce_sys/param.json

      # This is the ready-to-install Actions ZIP. Unlike the release-bundle
      # artifact (which includes dist/ and symbols), its sole top-level folder
      # is PPSA99008/ with eboot.bin immediately inside.
      - name: Upload FTP-ready title folder
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Eden-Encore-PS5-FTP-PPSA99008
          path: build/release/
          retention-days: 14
          if-no-files-found: error

      - name: Retrieve FTP-ready archive and verify exact folder
        if: ${{ success() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Eden-Encore-PS5-FTP-PPSA99008
          path: build/release-zip-layout-verification

      - name: Validate actual downloadable FTP ZIP root
        if: ${{ success() }}
        run: |
          test "$(ls -A build/release-zip-layout-verification)" = PPSA99008
          test -s build/release-zip-layout-verification/PPSA99008/eboot.bin
          test -f build/release-zip-layout-verification/PPSA99008/sce_sys/param.json
          test ! -e build/release-zip-layout-verification/eboot.bin
          python3 - <<'PY_FTP'
          import json
          from pathlib import Path
          app = Path('build/release-zip-layout-verification/PPSA99008')
          assert json.loads((app/'sce_sys/param.json').read_text())['titleId'] == app.name
          print('RELEASE_FTP_ARCHIVE_ROOT_OK PPSA99008/eboot.bin')
          PY_FTP

      - name: Upload compiled release bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prospero.Eden-Encore-release
          path: |
            dist/
            build/symbols/
          retention-days: 14
          if-no-files-found: error

      - name: Save build caches after verified artifact uploads
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}

  release:
    needs: build
    if: >-
      ${{ needs.build.result == 'success' &&
          github.ref == 'refs/heads/dev/ps5-sparse-jit' &&
          ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
           (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download compiled bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Prospero.Eden-Encore-release
          path: release-bundle

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -f release-bundle/dist/SHA256SUMS
          ls release-bundle/dist/*.zip >/dev/null
          ls release-bundle/dist/*.ffpfsc >/dev/null
          (cd release-bundle/dist && sha256sum -c SHA256SUMS)

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="encore-R1-${short}"
          notes="release-bundle/dist/release-notes.md"
          test -f "$notes"
          gh release create "$tag" \
            release-bundle/dist/*.zip \
            release-bundle/dist/*.ffpfsc \
            release-bundle/dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Prospero.Eden Encore R1 (${short})" \
            --notes-file "$notes" \
            --latest
