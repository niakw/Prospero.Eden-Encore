          python3 -B tools/check-jit-sparse-host.py
          python3 -B tools/check-ps5-sparse-jit-va-lifetime.py
          python3 -B tools/check-ps5-direct-limit-host.py
          python3 -B tools/check-ps5-virtual-reservation-host.py
          python3 -B tools/check-shader-cache-pressure.py
          python3 -B tools/check-vulkan-gc-budget-host.py
          python3 -B tools/check-vulkan-gc-prefetch-host.py
          python3 -B tools/check-vulkan-gc-mixed-prefetch-host.py
          python3 -B tools/check-vulkan-readback-small-vector-host.py
          python3 -B tools/check-vulkan-readback-batch-integration-host.py
          python3 -B tools/check-vulkan-pipeline-trace-thread-host.py
          python3 -B tools/check-vulkan-present-wait-host.py
          python3 -B tools/check-vulkan-present-source-replay-host.py
          python3 -B tools/check-performance-policy.py
          python3 -B tools/check-ps5-quiet-cpu-io-clocks.py
          python3 -B tools/check-ps5-upstream-fixes-r302.py
          python3 -B tools/check-ps5-quiet-guest-entry.py
          python3 -B tools/check-ps5-direct-pool-host.py
          python3 -B tools/check-ps5-pc-ring-host.py
          python3 -B tools/check-ps5-worker-lifetime-host.py
          python3 -B tools/check-ps5-native-load-replay.py
          python3 -B tools/check-ps5-native-timing-replay.py
          python3 -B tools/check-fc27-stutter-regimes.py --self-test
          python3 -B tools/analyze-fc27-lock-wait-tails.py --self-test
          python3 -B tools/check-ps5-display-vs-guest-fps.py
          python3 -B tools/check-ps5-async-present-source-stress.py
          python3 -B tools/check-ps5-vulkan-present-submit-contention.py
          python3 -B tools/check-ps5-buffer-dequeue-generation.py
          python3 -B tools/check-ps5-buffer-presentation-state-space.py
          python3 -B tools/check-hle-counter-contention.py
          python3 -B tools/check-network-runtime.py
          python3 -B tools/check-guest-network-isolation.py
          python3 -B tools/check-nlib-media-safety.py
          python3 -B tools/check-nlib-ui-recovery.py
          python3 -B tools/check-ps5-log-analysis.py
          python3 -B tools/check-ps5-frame-window-analysis.py
          python3 -B tools/check-game-frame-summary.py
          python3 -B tools/check-ps5-vulkan-dispatch-ceiling.py
          python3 -B tools/check-ps5-vulkan-cache-phases.py
          python3 -B tools/check-ps5-fast-first-pipelines.py
          python3 -B tools/check-native-shader-cache-eligibility.py --self-test
          python3 -B tools/check-universal-emulation-policy.py
          python3 -B tools/check-runtime-frame-budget.py
          python3 -B tools/check-library-docked-snapshot-host.py
          python3 -B tools/check-fc27-hle-compat.py
          python3 -B tools/check-net-cache-migration.py
          python3 -B tools/check-ps5-net-unit.py
          python3 -B tools/check-home-reference.py
          python3 -B tools/check-ps5-launcher-r385.py
          python3 -B tools/check-home-media.py
          python3 -B tools/check-launch-case-artwork.py
          python3 -B tools/check-bounded-logs.py
          python3 -B tools/check-log-budget.py
          python3 -B tools/check-log-pipe-unit.py
          python3 -B tools/check-release-hotpath.py
          python3 -B tools/check-sm-host-wait.py
          python3 -B tools/check-dummy-thread-waits.py
          python3 -B tools/check-dynarmic-icache.py
          python3 -B tools/check-ps5-backport-policy.py
          python3 -B tools/check-upstream-guest-scheduler-locks.py
          python3 -B tools/check-game-liveness.py
          python3 -B tools/check-ps5-guest-fault-recovery.py
          python3 -B tools/check-fc27-trace.py
          python3 -B tools/check-ci-neutral-labels.py
          python3 -B tools/check-credit-attribution.py
          python3 -B tools/check-ci-cache.py
          python3 -B tools/check-package-flexible-memory.py
          if (( validation_failed )); then
            echo "::error::One or more source/host contracts failed; native build blocked"
            exit 1
          fi

      - name: Preflight release packaging
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: bash tools/ci/package-image.sh --prepare

      - name: Restore staged app from a previous failed run
        if: ${{ env.RESUME_STAGE_RUN_ID != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Prospero.Eden-Encore-staged-app
          path: build/release/PPSA99008
          github-token: ${{ github.token }}
          run-id: ${{ env.RESUME_STAGE_RUN_ID }}

      - name: Prepare native build inputs
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: make prepare JOBS=4

      - name: Prepare local retail case index
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          python3 -B tools/launcher/build-box-art-index.py --self-test
          if python3 -B tools/launcher/build-box-art-index.py --download --output headless/prosperoeden/ui/box-art-index.tsv; then
            echo "Retail scan index ready (no full database shipped)"
          else
            # Network/catalog outages must never prevent an emulator build.
            rm -f headless/prosperoeden/ui/box-art-index.tsv
            echo "::warning::Optional case index unavailable; cached/user-provided artwork remains supported"
          fi

      - name: Build and stage native app (release or development)
        id: stage
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        env:
          EDEN_SKIP_PREBUILD_SOURCE_CHECKS: ${{ inputs.build_only && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$EDEN_TEST_ALL_ON" == 1 ]]; then
            bash tools/build-package.sh dev "$EDEN_TEST_TITLE_ID"
          else
            bash tools/build-package.sh release-stage
          fi

      - name: Upload resumable staged app
        if: ${{ steps.stage.outcome == 'success' && env.EDEN_TEST_ALL_ON != '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prospero.Eden-Encore-staged-app
          path: ${{ env.EDEN_STAGE_DIR }}/
          retention-days: 7
          if-no-files-found: error

      - name: Validate freshly built staged app
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        env:
          EDEN_PACKAGE_DIR: ${{ env.EDEN_STAGE_DIR }}
        run: |
          python3 -B headless/check_package.py --check
          python3 -B tools/ci/check-staged-app.py "$EDEN_STAGE_DIR"
          if [[ "$EDEN_TEST_ALL_ON" == 1 ]]; then
            python3 -B tools/ci/check-all-on-test-binary.py "$EDEN_STAGE_DIR" "$EDEN_TEST_TITLE_ID"
          else
            # Check the compiled CMake profile, not just source/eboot strings.
            python3 -B tools/ci/check-release-experiments.py "$EDEN_STAGE_DIR"
          fi

      - name: Record matching debug ELF and native binary digests
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        run: |
          python3 -B tools/ci/write-crash-provenance.py \
            --app build/dev/PPSA99008 \
            --native build/headless-native \
            --output build/headless-native/crash-provenance.json \
            --test-title "$EDEN_TEST_TITLE_ID"

      # Upload the title DIRECTORY, not just its contents. Installing an
      # extracted ZIP must yield /data/homebrew/PPSA99008/eboot.bin directly.
      # The compiled game's 16-hex Switch Title ID is for autoboot, never the
      # PS5 homebrew's own folder or sce_sys/param.json titleId.
      - name: Validate self-contained development package root
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        run: |
          test -d build/dev/PPSA99008
          test -f build/dev/PPSA99008/eboot.bin
          test -f build/dev/PPSA99008/sce_sys/param.json
          test "$(ls -A build/dev)" = PPSA99008
          python3 - <<'PY'
          from pathlib import Path
          import json
          app = Path('build/dev/PPSA99008')
          assert json.loads((app / 'sce_sys/param.json').read_text())['titleId'] == app.name
          print('PS5_TEST_ARCHIVE_ROOT_OK PPSA99008/eboot.bin')
          PY

      - name: Upload validated native development package
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prospero.Eden-Encore-PS5-all-on-test
          # upload-artifact strips the chosen root directory. Upload its PARENT
          # to preserve PPSA99008/ as the archive's top-level directory.
          path: build/dev/
          retention-days: 14
          if-no-files-found: error

      # Verify the *uploaded* archive after extraction, not only the staging
      # tree. This catches upload-artifact flattening PPSA99008 by mistake.
      - name: Verify downloadable application archive layout
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4.1.8
        with:
          name: Prospero.Eden-Encore-PS5-all-on-test
          path: build/zip-layout-verification

      - name: Verify extracted title directory and runtime metadata
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        run: |
          test -f build/zip-layout-verification/PPSA99008/eboot.bin
          test -f build/zip-layout-verification/PPSA99008/sce_sys/param.json
          test -f build/zip-layout-verification/PPSA99008/network-hosts.txt
          test -d build/zip-layout-verification/PPSA99008/ui
          test ! -f build/zip-layout-verification/eboot.bin
          python3 - <<'PY'
          from pathlib import Path
          import json
          app = Path('build/zip-layout-verification/PPSA99008')
          value = json.loads((app / 'sce_sys/param.json').read_text())
          assert value['titleId'] == 'PPSA99008', value
          print('EXTRACTED_PS5_TEST_ZIP PASS: PPSA99008/eboot.bin + matching titleId')
          PY

      - name: Upload native development debug symbols
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prospero.Eden-Encore-PS5-all-on-symbols
          path: |
            build/headless-native/llvm-pie.elf
            build/headless-native/link.map
            build/headless-native/crash-provenance.json
          retention-days: 14
          if-no-files-found: error

      - name: Validate resumed staged app
        if: ${{ env.RESUME_STAGE_RUN_ID != '' }}
        run: python3 -B tools/ci/check-staged-app.py build/release/PPSA99008

      - name: Assemble release files
        if: ${{ env.EDEN_TEST_ALL_ON != '1' }}
        run: python3 -B tools/ci/make-dist.py build/release/PPSA99008

      - name: Upload compiled release bundle
        if: ${{ success() && env.EDEN_TEST_ALL_ON != '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prospero.Eden-Encore-release
          path: |
            dist/
            build/symbols/
          retention-days: 14
          if-no-files-found: error

      - name: Save build caches after verified artifact uploads
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}

  release:
    needs: build
    if: >-
      ${{ needs.build.result == 'success' && !inputs.test_all_on &&
          github.ref == 'refs/heads/fix/0.40-zbic-13.60' &&
          ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
           (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download compiled bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Prospero.Eden-Encore-release
          path: release-bundle

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -f release-bundle/dist/SHA256SUMS
          ls release-bundle/dist/*.zip >/dev/null
          ls release-bundle/dist/*.ffpfsc >/dev/null
          (cd release-bundle/dist && sha256sum -c SHA256SUMS)

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="encore-R1-${short}"
          notes="release-bundle/dist/release-notes.md"
          test -f "$notes"
          gh release create "$tag" \
            release-bundle/dist/*.zip \
            release-bundle/dist/*.ffpfsc \
            release-bundle/dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Prospero.Eden Encore R1 (${short})" \
            --notes-file "$notes" \
            --latest

  # Publish the immutable archive FROM an already-green run. This MUST NOT
  # rebuild at the current (possibly newer) dev branch or claim unshipped
  # experiments are present. The download is pinned to source SHA and run ID.
  publish_green_test_build:
    if: ${{ github.ref == 'refs/heads/dev/ps5-sparse-jit' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-existing:38743260411]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download immutable successful test artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Prospero.Eden-Encore-PS5-all-on-test
          run-id: 38743260411
          github-token: ${{ github.token }}
          path: pinned-app
      - name: Package validated test app as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s pinned-app/PPSA99008/eboot.bin
          test -s pinned-app/PPSA99008/sce_sys/param.json
          test -d pinned-app/PPSA99008/ui
          test "$(find pinned-app -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          mkdir -p release-dist
          (cd pinned-app && zip -qr ../release-dist/Eden-Encore-5edc677b-PPSA99008.zip PPSA99008)
          (cd release-dist && sha256sum Eden-Encore-5edc677b-PPSA99008.zip > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat > release-dist/RELEASE-NOTES.md <<'NOTES'
          # Eden Encore — validated PS5 test build (5edc677b)

          Source SHA: `5edc677b6dbe5f74fac558e92f35b421b7ba72b6`

          Native Actions run: https://github.com/niakw/Prospero.Eden-Encore/actions/runs/38743260411

          The tested All-On profile includes diagnostic tools but DOES NOT
          include the separately quarantined Dynarmic I-cache, dummy-thread
          or service-manager host-wait backports, nor shared JIT or batching.
          This version has not been demonstrated to fix game freezes, HUD
          delays, or cold-start stutter.

          Install contents of the ZIP under the intended PPSA99008 app folder.
          This is a development **pre-release**, not a new stable R1.
          NOTES
          gh release create encore-test-5edc677b             release-dist/Eden-Encore-5edc677b-PPSA99008.zip             release-dist/SHA256SUMS             --repo "$GITHUB_REPOSITORY"             --target 5edc677b6dbe5f74fac558e92f35b421b7ba72b6             --title "Eden Encore PS5 test build (5edc677b)"             --notes-file release-dist/RELEASE-NOTES.md             --prerelease --latest=false
